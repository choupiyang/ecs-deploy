<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>SenseNova-Vision — 统一多模态视觉生成</title>
<style>
:root{--bg:#E5E1D6;--text:#111817;--accent:#C8FF00;--func:#7F8270;--card-w:min(360px,92vw);--card-h:calc(var(--card-w)*16/9)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:PingFang SC,Microsoft YaHei,system-ui,-apple-system,sans-serif;line-height:1.7;min-height:100vh;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center}
canvas#bg3d{position:fixed;inset:0;z-index:0;pointer-events:none}

/* 卡片容器 - 9:16 fixed */
.card-wrap{position:relative;z-index:1;width:var(--card-w);margin:24px auto 0;perspective:1200px}
.card-916{position:relative;width:100%;height:var(--card-h);background:var(--bg);color:var(--text);border-radius:8px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}

/* 封面区 - 深色背景+SVG+标题 */
.cover-area{height:45%;background:linear-gradient(135deg,#1a1a2e,#0f3460);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cover-area svg{position:absolute;inset:0;width:100%;height:100%;opacity:.4}
.cover-title{position:relative;z-index:2;text-align:center;color:#c8ff00}
.cover-title h1{font-size:clamp(20px,5vw,32px);font-weight:900;letter-spacing:-.04em;text-shadow:0 0 20px rgba(200,255,0,.3)}
.cover-title p{font-size:clamp(10px,2.5vw,13px);color:rgba(200,255,0,.7);margin-top:4px;letter-spacing:.5px}

/* 内容区 */
.content-area{padding:16px 18px;height:55%;overflow-y:auto;background:var(--bg)}
.content-area::-webkit-scrollbar{width:3px}
.content-area::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}

.meta{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.meta span{padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600;background:rgba(200,255,0,.12);color:var(--text)}
.meta span.org{background:var(--text);color:var(--bg)}

.desc{font-size:13px;line-height:1.6;color:#2a2f2a;margin-bottom:10px}
.desc strong{color:var(--text)}

.bench-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.bench-item{background:rgba(200,255,0,.06);border:1px solid rgba(200,255,0,.12);border-radius:4px;padding:8px 10px;font-size:11px}
.bench-item .num{display:block;font-size:16px;font-weight:900;color:var(--accent);letter-spacing:-.04em}
.bench-item .label{color:var(--func);font-size:10px;margin-top:2px}

.links{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.links a{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:4px;font-size:12px;font-weight:700;text-decoration:none;transition:.2s;background:var(--text);color:var(--bg)}
.links a:hover{background:var(--accent);color:var(--text)}

.back{display:inline-flex;align-items:center;gap:4px;margin:8px 0 16px;color:var(--func);text-decoration:none;font-size:12px;position:relative;z-index:1}
.back:hover{color:var(--accent)}

@media(max-width:400px){.bench-grid{grid-template-columns:1fr}.card-wrap{margin:12px auto 0}.content-area{padding:12px 14px}}
</style>
</head>
<body>
<a class="back" href="/youngsinsight/">← 返回首页</a>
<div class="card-wrap">
<div class="card-916">
  <div class="cover-area">
    <svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c8ff00" stop-opacity=".3"/><stop offset="100%" stop-color="#00e5ff" stop-opacity=".1"/></linearGradient>
      </defs>
      <!-- Grid pattern -->
      <g stroke="#c8ff00" stroke-width=".3" opacity=".15">
        <line x1="0" y1="40" x2="360" y2="40"/><line x1="0" y1="60" x2="360" y2="60"/>
        <line x1="0" y1="80" x2="360" y2="80"/><line x1="0" y1="100" x2="360" y2="100"/>
        <line x1="0" y1="120" x2="360" y2="120"/>
        <line x1="60" y1="30" x2="60" y2="140"/><line x1="120" y1="30" x2="120" y2="140"/>
        <line x1="180" y1="30" x2="180" y2="140"/><line x1="240" y1="30" x2="240" y2="140"/>
        <line x1="300" y1="30" x2="300" y2="140"/>
      </g>
      <!-- Wireframe camera/lens -->
      <g transform="translate(180,75)" stroke="#c8ff00" fill="none" stroke-width="1.8" opacity=".8">
        <rect x="-35" y="-22" width="70" height="44" rx="6"/>
        <circle cx="0" cy="0" r="14"/><circle cx="0" cy="0" r="7" opacity=".5"/><circle cx="0" cy="0" r="2.5" fill="#c8ff00" opacity=".7"/>
        <rect x="22" y="-18" width="7" height="5" rx="1"/>
      </g>
      <!-- Neural net lines -->
      <g opacity=".35" stroke="#00e5ff" stroke-width=".6">
        <circle cx="50" cy="40" r="2.5" fill="#c8ff00"/><circle cx="310" cy="40" r="2.5" fill="#c8ff00"/>
        <circle cx="40" cy="100" r="2" fill="#c8ff00"/><circle cx="320" cy="100" r="2" fill="#c8ff00"/>
        <line x1="50" y1="40" x2="310" y2="40" opacity=".2"/><line x1="40" y1="100" x2="320" y2="100" opacity=".2"/>
      </g>
      <!-- Code-like wave -->
      <g transform="translate(30,130)" opacity=".25" fill="none" stroke="#c8ff00" stroke-width=".8">
        <polyline points="0,0 40,-8 80,4 120,-12 160,2 200,-6 240,8 280,-4 310,6"/>
        <polyline points="0,8 40,0 80,12 120,-4 160,10 200,2 240,16 280,4 310,14" opacity=".12" stroke="#00e5ff"/>
      </g>
    </svg>
    <div class="cover-title">
      <h1>SenseNova-Vision</h1>
      <p>7B · MoT · Unified Vision</p>
    </div>
  </div>
  <div class="content-area">
    <div class="meta">
      <span class="org">商汤科技</span>
      <span>7B</span>
      <span>MoT</span>
      <span>CC BY-NC 4.0</span>
    </div>
    <div class="desc">
      <strong>统一多模态视觉生成模型</strong>——把所有 CV 任务统一成 UMM 的文本+图像生成，不需要专用检测头/分割解码器/深度分支。
    </div>
    <div class="bench-grid">
      <div class="bench-item"><span class="num">56.6</span><span class="label">COCO 检测 mAP</span></div>
      <div class="bench-item"><span class="num">54.8</span><span class="label">LVIS 长尾检测</span></div>
      <div class="bench-item"><span class="num">66.8</span><span class="label">Dense200 密集检测</span></div>
      <div class="bench-item"><span class="num">49.5</span><span class="label">ICDAR15 OCR</span></div>
      <div class="bench-item"><span class="num">98.1</span><span class="label">NYUv2 深度 δ1↑</span></div>
      <div class="bench-item"><span class="num">68.9</span><span class="label">ScanNet 法线 11.25°↑</span></div>
    </div>
    <div class="links">
      <a href="https://github.com/OpenSenseNova/SenseNova-Vision">GitHub</a>
      <a href="https://modelscope.cn/models/SenseNova/SenseNova-Vision-7B-MoT">ModelScope</a>
      <a href="https://arxiv.org/abs/2607.06560">arXiv</a>
    </div>
  </div>
</div>
</div>

<script>
// Simple 3D background with Three.js (async)
(function(){
  var c=document.createElement('script');
  c.src='https://cdn.bootcdn.net/ajax/libs/three.js/r134/three.min.js';
  c.onload=function(){
    var canvas=document.createElement('canvas');
    canvas.id='bg3d';
    canvas.style.cssText='position:fixed;inset:0;z-index:0;pointer-events:none';
    document.body.prepend(canvas);
    
    var scene=new THREE.Scene();
    scene.fog=new THREE.Fog(0x0a0a1a,20,60);
    var cam=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,100);
    cam.position.set(0,4,18);
    cam.lookAt(0,0,0);
    var renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true});
    renderer.setSize(window.innerWidth,window.innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));

    // Grid
    var grid=new THREE.GridHelper(40,20,0x1a1a2e,0x1a1a2e);
    grid.position.y=-2;scene.add(grid);

    // Floating particles
    var pGeo=new THREE.BufferGeometry();
    var pCount=200;
    var pPos=new Float32Array(pCount*3);
    for(var i=0;i<pCount*3;i++)pPos[i]=(Math.random()-0.5)*40;
    pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
    var pMat=new THREE.PointsMaterial({color:0x1a1a2e,size:0.08,transparent:true,opacity:0.6});
    scene.add(new THREE.Points(pGeo,pMat));

    // Accent particles
    var aMat=new THREE.PointsMaterial({color:0xc8ff00,size:0.06,transparent:true,opacity:0.3});
    scene.add(new THREE.Points(pGeo.clone(),aMat));

    var t=0;
    function animate(){
      requestAnimationFrame(animate);
      t+=0.005;
      scene.rotation.y=Math.sin(t*0.05)*0.1;
      renderer.render(scene,cam);
    }
    animate();

    window.addEventListener('resize',function(){
      cam.aspect=window.innerWidth/window.innerHeight;cam.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight);
    });
  };
  c.onerror=function(){};
  document.head.appendChild(c);
})();
</script>
</body>
</html>
