<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="356" viewBox="0 0 200 356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16110C"/>
      <stop offset="1" stop-color="#080707"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8F66"/>
      <stop offset="0.55" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#993309"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#2A1E14" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)" opacity="0.3"/>

  <!-- 顶部栏 -->
  <rect x="0" y="0" width="200" height="2" fill="#FF6B35" opacity="0.9"/>
  <text x="16" y="24" font-family="monospace" font-size="7" fill="#7A6E60" letter-spacing="2">MINIMAX DESIGN</text>
  <text x="184" y="24" font-family="monospace" font-size="7" fill="#FF6B35" text-anchor="end">MULTIMODAL AGENT</text>

  <!-- 中心: 多模态画布节点网络（创作流汇聚 H3 核心） -->
  <g transform="translate(100,120)">
    <!-- 轨道环 -->
    <circle r="52" fill="none" stroke="#FF6B35" stroke-width="0.6" stroke-opacity="0.18" stroke-dasharray="3 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle r="38" fill="none" stroke="#FF8F66" stroke-width="0.6" stroke-opacity="0.22" stroke-dasharray="5 4">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- H3 汇聚核心 -->
    <circle r="11" fill="url(#coreGrad)" opacity="0.9" filter="url(#glow)">
      <animate attributeName="r" values="10;12.5;10" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="3" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#1A0D05">H3</text>

    <!-- 四角素材节点（脚本/图/音频/视频）射向核心 -->
    <g>
      <rect x="-72" y="-52" width="26" height="14" rx="3" fill="#16110C" stroke="#FF6B35" stroke-width="0.6" stroke-opacity="0.5"/>
      <text x="-59" y="-42.5" text-anchor="middle" font-family="monospace" font-size="5.5" fill="#FF8F66">SCRIPT</text>
    </g>
    <g>
      <rect x="46" y="-58" width="22" height="14" rx="3" fill="#16110C" stroke="#FF8F66" stroke-width="0.6" stroke-opacity="0.45"/>
      <text x="57" y="-48.5" text-anchor="middle" font-family="monospace" font-size="5.5" fill="#FF8F66">IMG</text>
    </g>
    <g>
      <rect x="50" y="34" width="26" height="14" rx="3" fill="#16110C" stroke="#FF6B35" stroke-width="0.6" stroke-opacity="0.45"/>
      <text x="63" y="44.5" text-anchor="middle" font-family="monospace" font-size="5.5" fill="#FF8F66">AUDIO</text>
    </g>
    <g>
      <rect x="-74" y="30" width="26" height="14" rx="3" fill="#16110C" stroke="#FF8F66" stroke-width="0.6" stroke-opacity="0.45"/>
      <text x="-61" y="40.5" text-anchor="middle" font-family="monospace" font-size="5.5" fill="#FF8F66">VIDEO</text>
    </g>

    <!-- 连线 -->
    <g stroke="#FF6B35" stroke-width="0.7" fill="none">
      <line x1="-46" y1="-45" x2="-9" y2="-7" stroke-opacity="0.25">
        <animate attributeName="stroke-opacity" values="0.15;0.45;0.15" dur="3s" repeatCount="indefinite"/>
      </line>
      <line x1="46" y1="-50" x2="9" y2="-8" stroke-opacity="0.2">
        <animate attributeName="stroke-opacity" values="0.12;0.4;0.12" dur="3.2s" repeatCount="indefinite" begin="0.6s"/>
      </line>
      <line x1="50" y1="40" x2="9" y2="8" stroke-opacity="0.25">
        <animate attributeName="stroke-opacity" values="0.15;0.45;0.15" dur="2.6s" repeatCount="indefinite" begin="1s"/>
      </line>
      <line x1="-48" y1="36" x2="-9" y2="7" stroke-opacity="0.2">
        <animate attributeName="stroke-opacity" values="0.12;0.4;0.12" dur="3.4s" repeatCount="indefinite" begin="0.3s"/>
      </line>
    </g>

    <!-- 素材光点沿线流向核心 -->
    <circle r="1.8" fill="#FF9A55">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M-46,-45 L-9,-7 Z" begin="0s"/>
    </circle>
    <circle r="1.8" fill="#FFC27A">
      <animateMotion dur="3s" repeatCount="indefinite" path="M46,-50 L9,-8 Z" begin="0.7s"/>
    </circle>
    <circle r="1.8" fill="#FF9A55">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M50,40 L9,8 Z" begin="1.1s"/>
    </circle>
    <circle r="1.8" fill="#FFC27A">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M-48,36 L-9,7 Z" begin="0.4s"/>
    </circle>

    <!-- 成片出口 -->
    <rect x="-32" y="58" width="64" height="13" rx="6.5" fill="#0A0908" stroke="#FF6B35" stroke-width="0.6" opacity="0.9">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="67.5" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#FF8F66">说想法 → <tspan fill="#FFD9B0" font-weight="bold">成片</tspan></text>
  </g>

  <!-- 标题区 -->
  <text x="100" y="240" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#F5F0E8">MiniMax Design</text>
  <text x="100" y="276" text-anchor="middle" font-family="monospace" font-size="6" fill="#FF6B35" letter-spacing="1.5">FROM PIXELS TO SEMANTICS</text>
  <text x="100" y="290" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#B8A898">操作语义而非像素 · H3 开源驱动 · 多模态画布</text>

  <!-- 数据条 -->
  <rect x="24" y="302" width="152" height="24" rx="12" fill="#120D08" stroke="#2E2014" stroke-width="0.8"/>
  <text x="100" y="318" text-anchor="middle" font-family="monospace" font-size="7" fill="#F5F0E8">5步成片 · 3D导演台 · ComfyUI 生态</text>

  <!-- 底部 -->
  <text x="100" y="338" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#7A6E60" letter-spacing="1">MIND RESONANCE · 反共识观察</text>
</svg>
