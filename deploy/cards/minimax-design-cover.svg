<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 356" width="200" height="356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C0C0E"/>
      <stop offset="100%" stop-color="#161618"/>
    </linearGradient>
    <radialGradient id="glow1" cx="75%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#FF8F66" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#FF6B35" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#glow1)"/>
  <rect width="200" height="356" fill="url(#glow2)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#F2F0ED" stroke-width="0.5">
    <line x1="0" y1="40" x2="200" y2="40"/><line x1="0" y1="80" x2="200" y2="80"/>
    <line x1="0" y1="120" x2="200" y2="120"/><line x1="0" y1="160" x2="200" y2="160"/>
    <line x1="0" y1="200" x2="200" y2="200"/><line x1="0" y1="240" x2="200" y2="240"/>
    <line x1="0" y1="280" x2="200" y2="280"/><line x1="0" y1="320" x2="200" y2="320"/>
    <line x1="40" y1="0" x2="40" y2="356"/><line x1="80" y1="0" x2="80" y2="356"/>
    <line x1="120" y1="0" x2="120" y2="356"/><line x1="160" y1="0" x2="160" y2="356"/>
  </g>

  <!-- Central Canvas Core -->
  <g transform="translate(100, 155)">
    <!-- Outer ring glow -->
    <circle r="62" fill="none" stroke="#FF6B35" stroke-width="0.5" stroke-opacity="0.12" filter="url(#blur2)"/>
    <circle r="50" fill="none" stroke="#FF6B35" stroke-width="0.5" stroke-opacity="0.2" stroke-dasharray="3 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle r="38" fill="none" stroke="#FF8F66" stroke-width="0.5" stroke-opacity="0.25" stroke-dasharray="5 4">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <!-- Core -->
    <circle r="14" fill="url(#coreGlow)" filter="url(#blur1)"/>
    <circle r="6" fill="#FF6B35" opacity="0.9">
      <animate attributeName="r" values="5;7;5" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floating Nodes -->
  <!-- Node 1 - top left -->
  <g opacity="0.7">
    <rect x="30" y="52" width="16" height="12" rx="3" fill="#FF6B35" fill-opacity="0.15" stroke="#FF6B35" stroke-width="0.6" stroke-opacity="0.5"/>
    <circle cx="38" cy="58" r="2" fill="#FF6B35" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Node 2 - top right -->
  <g opacity="0.7">
    <rect x="148" y="42" width="18" height="14" rx="3" fill="#FF8F66" fill-opacity="0.12" stroke="#FF8F66" stroke-width="0.6" stroke-opacity="0.4"/>
    <circle cx="157" cy="49" r="2" fill="#FF8F66" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.3s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>
  <!-- Node 3 - right -->
  <g opacity="0.6">
    <rect x="155" y="128" width="14" height="11" rx="3" fill="#FF6B35" fill-opacity="0.12" stroke="#FF6B35" stroke-width="0.5" stroke-opacity="0.4"/>
    <circle cx="162" cy="133" r="1.8" fill="#FF6B35" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.8s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
  </g>
  <!-- Node 4 - bottom left -->
  <g opacity="0.65">
    <rect x="25" y="215" width="17" height="13" rx="3" fill="#FF8F66" fill-opacity="0.1" stroke="#FF8F66" stroke-width="0.5" stroke-opacity="0.35"/>
    <circle cx="33" cy="221" r="1.8" fill="#FF8F66" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>
  <!-- Node 5 - bottom right -->
  <g opacity="0.55">
    <rect x="150" y="268" width="15" height="12" rx="3" fill="#FF6B35" fill-opacity="0.1" stroke="#FF6B35" stroke-width="0.5" stroke-opacity="0.3"/>
    <circle cx="157" cy="274" r="1.8" fill="#FF6B35" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.2s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
  </g>

  <!-- Connection Lines (canvas node links) -->
  <g stroke="#FF6B35" stroke-width="0.6" fill="none">
    <line x1="46" y1="58" x2="88" y2="145" stroke-opacity="0.15">
      <animate attributeName="stroke-opacity" values="0.15;0.35;0.15" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="148" y1="49" x2="112" y2="142" stroke-opacity="0.12">
      <animate attributeName="stroke-opacity" values="0.12;0.3;0.12" dur="3s" repeatCount="indefinite" begin="0.7s"/>
    </line>
    <line x1="155" y1="133" x2="112" y2="155" stroke-opacity="0.15">
      <animate attributeName="stroke-opacity" values="0.15;0.35;0.15" dur="2.5s" repeatCount="indefinite" begin="1.2s"/>
    </line>
    <line x1="42" y1="221" x2="90" y2="165" stroke-opacity="0.1">
      <animate attributeName="stroke-opacity" values="0.1;0.28;0.1" dur="3.2s" repeatCount="indefinite" begin="0.4s"/>
    </line>
    <line x1="150" y1="274" x2="110" y2="168" stroke-opacity="0.08">
      <animate attributeName="stroke-opacity" values="0.08;0.22;0.08" dur="2.8s" repeatCount="indefinite" begin="1.5s"/>
    </line>
    <!-- Cross-connections between nodes -->
    <line x1="46" y1="58" x2="155" y2="128" stroke-opacity="0.06" stroke-dasharray="2 4">
      <animate attributeName="stroke-opacity" values="0.06;0.15;0.06" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="42" y1="228" x2="150" y2="268" stroke-opacity="0.06" stroke-dasharray="2 4">
      <animate attributeName="stroke-opacity" values="0.06;0.12;0.06" dur="3.5s" repeatCount="indefinite" begin="1s"/>
    </line>
  </g>

  <!-- Pulse dots along lines -->
  <circle r="1.5" fill="#FF6B35">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M46,58 L88,145"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.5" fill="#FF8F66">
    <animateMotion dur="2.8s" repeatCount="indefinite" begin="0.6s" path="M148,49 L112,142"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="2.8s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle r="1.5" fill="#FF6B35">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="1.2s" path="M155,133 L112,155"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="2.2s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
  <circle r="1.2" fill="#FF8F66">
    <animateMotion dur="3s" repeatCount="indefinite" begin="0.8s" path="M42,221 L90,165"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
</svg>
