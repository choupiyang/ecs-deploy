<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="356" viewBox="0 0 200 356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3523"/>
      <stop offset="1" stop-color="#232018"/>
    </linearGradient>
    <linearGradient id="catGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8923A"/>
      <stop offset="1" stop-color="#C7A24E"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#F4B875"/>
      <stop offset="0.55" stop-color="#E8923A"/>
      <stop offset="1" stop-color="#C76B1E"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#554E38" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="356" fill="#2B2817"/>
  <rect width="200" height="356" fill="url(#grid)" opacity="0.35"/>

  <!-- 顶部栏 -->
  <rect x="0" y="0" width="200" height="2" fill="url(#catGrad)" opacity="0.85"/>
  <text x="16" y="24" font-family="monospace" font-size="7" fill="#8C8268" letter-spacing="2">CAT ON CHAIR</text>
  <text x="184" y="24" font-family="monospace" font-size="7" fill="#E8923A" text-anchor="end">$18K/M</text>

  <!-- 中心: 猫咪心流轨道（番茄钟核 + 轨道猫 + 礼物循环） -->
  <g transform="translate(100,132)">
    <!-- 轨道环 -->
    <g>
      <circle r="52" fill="none" stroke="#C7A24E" stroke-width="1" stroke-dasharray="4 5" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle r="39" fill="none" stroke="#759444" stroke-width="0.8" stroke-dasharray="3 6" opacity="0.45">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="20s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- 径向丝 -->
    <g stroke="#554E38" stroke-width="0.7" opacity="0.6">
      <line x1="0" y1="-52" x2="0" y2="52"/>
      <line x1="-52" y1="0" x2="52" y2="0"/>
      <line x1="-37" y1="-37" x2="37" y2="37"/>
      <line x1="37" y1="-37" x2="-37" y2="37"/>
    </g>

    <!-- 中心番茄钟核（心流） -->
    <g filter="url(#glow)">
      <circle r="26" fill="url(#coreGrad)">
        <animate attributeName="r" values="26;27.5;26" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <!-- 番茄叶子 -->
      <path d="M0,-26 L-4,-33 M0,-26 L0,-35 M0,-26 L4,-33" stroke="#759444" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <!-- 番茄数字 -->
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="15" fill="#2E1A0A" font-weight="bold">25</text>
      <text x="0" y="14" text-anchor="middle" font-family="monospace" font-size="5" fill="#6B3A14" letter-spacing="1">FOCUS</text>
    </g>

    <!-- 轨道猫咪（绕行） -->
    <g>
      <g transform="translate(0,-52)">
        <animateTransform attributeName="transform" type="rotate" from="0 0 52" to="360 0 52" dur="10s" repeatCount="indefinite"/>
      </g>
    </g>
    <!-- 猫头：用轨道点表示 -->
    <circle r="3.2" fill="#E8923A" opacity="0.95">
      <animateMotion dur="10s" repeatCount="indefinite" path="M0,-52 A52,52 0 1,1 -0.01,-52 Z"/>
    </circle>
    <!-- 礼物漂浮 -->
    <g font-size="9" text-anchor="middle">
      <text y="2">🎁
        <animateMotion dur="7s" repeatCount="indefinite" path="M0,-52 A52,52 0 1,0 -0.01,-52 Z" begin="3.5s"/>
      </text>
      <text y="2">🐟
        <animateMotion dur="8s" repeatCount="indefinite" path="M0,-39 A39,39 0 0,1 -0.01,-39 Z" begin="1.2s"/>
      </text>
    </g>
  </g>

  <!-- 标题区 (Semantica 式, 两行) -->
  <text x="100" y="231" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#F5EFE2">Cat On<tspan x="100" dy="19">Chair</tspan></text>
  <text x="100" y="270" text-anchor="middle" font-family="monospace" font-size="6" fill="#C7A24E" letter-spacing="1.5">ADHD FOCUS TIMER</text>
  <text x="100" y="284" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#C6BB9E">为专注陪一只猫 · 月入 $18K</text>

  <!-- 数据条 -->
  <rect x="24" y="302" width="152" height="24" rx="12" fill="#332F1C" stroke="#554E38" stroke-width="0.8"/>
  <text x="100" y="318" text-anchor="middle" font-family="monospace" font-size="7.2" fill="#F5EFE2">$18K/M · 127K DL · 4.93 ★</text>

  <!-- 底部 -->
  <text x="100" y="338" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#8C8268" letter-spacing="1">MIND RESONANCE · 反共识观察</text>
</svg>
