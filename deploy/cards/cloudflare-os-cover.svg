<svg xmlns="http://www.w3.org/2000/svg" width="200" height="356" viewBox="0 0 200 356" role="img" aria-label="Cloudflare OS">
  <title>Cloudflare OS</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0E11"/>
      <stop offset="0.55" stop-color="#171B20"/>
      <stop offset="1" stop-color="#07090B"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD9A8"/>
      <stop offset="0.45" stop-color="#F6821F"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F6821F" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#F6821F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2EE6A8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2EE6A8" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonBig" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="#F6821F" stroke-opacity="0.06" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)"/>
  <circle cx="100" cy="128" r="80" fill="url(#glow)"/>
  <circle cx="100" cy="128" r="48" fill="url(#glow2)"/>

  <!-- 顶部品牌行 -->
  <g font-family="monospace" font-size="5.2" letter-spacing="1.6" fill="#6B6259">
    <text x="10" y="13">CLOUDFLARE · COMPANY OS</text>
    <text x="182" y="13" text-anchor="end" fill="#F6821F">🛰️</text>
  </g>

  <!-- 轨道核心系统：三层环 + 中心核 + 卫星 -->
  <!-- 外环虚线 -->
  <circle cx="100" cy="128" r="66" fill="none" stroke="#F6821F" stroke-opacity="0.2" stroke-width="0.7" stroke-dasharray="3 6">
    <animateTransform attributeName="transform" type="rotate" from="0 100 128" to="360 100 128" dur="28s" repeatCount="indefinite"/>
  </circle>
  <!-- 中环 -->
  <circle cx="100" cy="128" r="48" fill="none" stroke="#2EE6A8" stroke-opacity="0.22" stroke-width="0.7" stroke-dasharray="1.5 5">
    <animateTransform attributeName="transform" type="rotate" from="360 100 128" to="0 100 128" dur="18s" repeatCount="indefinite"/>
  </circle>
  <!-- 内环 -->
  <circle cx="100" cy="128" r="31" fill="none" stroke="#F6821F" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="2.5 4">
    <animateTransform attributeName="transform" type="rotate" from="0 100 128" to="360 100 128" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- 中心核（OS 内核） -->
  <circle cx="100" cy="128" r="14" fill="url(#core)" filter="url(#neonBig)"/>
  <circle cx="100" cy="128" r="14" fill="none" stroke="#FFE0BC" stroke-opacity="0.5" stroke-width="0.6"/>
  <circle cx="94" cy="122" r="4" fill="#FFE8D0" fill-opacity="0.5"/>
  <!-- 内核纹理：扇区线 -->
  <g stroke="#7A3C0D" stroke-opacity="0.55" stroke-width="0.5">
    <line x1="100" y1="114" x2="100" y2="128"/>
    <line x1="100" y1="128" x2="112" y2="128"/>
    <line x1="100" y1="128" x2="90" y2="120"/>
  </g>

  <!-- 卫星：Gadget 应用 -->
  <g filter="url(#neon)">
    <circle r="3" fill="#F6821F">
      <animateMotion dur="11s" repeatCount="indefinite" path="M100,97 A31,31 0 1,1 99.9,97"/>
    </circle>
    <circle r="2.2" fill="#FFC98F">
      <animateMotion dur="18s" repeatCount="indefinite" path="M100,80 A48,48 0 1,0 99.9,80"/>
    </circle>
    <circle r="2.5" fill="#2EE6A8">
      <animateMotion dur="28s" repeatCount="indefinite" path="M100,62 A66,66 0 1,1 99.9,62"/>
    </circle>
  </g>

  <!-- 数据流小方块（Gadget 代码块） -->
  <g fill="#F6821F" fill-opacity="0.7">
    <rect x="100" y="60" width="3" height="3" rx="0.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="148" y="118" width="3" height="3" rx="0.5">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite" begin="0.6s"/>
    </rect>
    <rect x="52" y="142" width="3" height="3" rx="0.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite" begin="1.2s"/>
    </rect>
    <rect x="126" y="190" width="3" height="3" rx="0.5">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite" begin="1.8s"/>
    </rect>
    <rect x="72" y="66" width="2.5" height="2.5" rx="0.5" fill="#2EE6A8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite" begin="0.9s"/>
    </rect>
    <rect x="58" y="98" width="2.5" height="2.5" rx="0.5" fill="#FFC98F">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite" begin="1.5s"/>
    </rect>
  </g>

  <!-- 底部标题区 -->
  <rect x="0" y="296" width="200" height="60" fill="url(#bg)" fill-opacity="0.92"/>
  <line x1="10" y1="296" x2="190" y2="296" stroke="#F6821F" stroke-opacity="0.4" stroke-width="0.8"/>

  <text x="14" y="320" font-family="monospace" font-size="6" letter-spacing="1.8" fill="#8A8F98">OPEN SOURCE · WORKERS</text>
  <text x="14" y="338" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#F5F1EC">Cloudflare OS<span fill="#F6821F" font-size="13">.</span></text>
  <text x="184" y="338" text-anchor="end" font-family="monospace" font-size="7.5" fill="#F6821F">5.1K★</text>
  <text x="14" y="351" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" letter-spacing="0.5" fill="#8A8F98">公司级 AI 操作系统 · 你的公司，你的 OS</text>
</svg>
