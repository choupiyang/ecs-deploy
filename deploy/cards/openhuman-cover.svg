<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 356" width="200" height="356">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A120E"/>
      <stop offset="0.55" stop-color="#080D0B"/>
      <stop offset="1" stop-color="#04070A"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="0.5" stop-color="#34D399"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="356" fill="url(#bgGrad)"/>
  <!-- 网格 -->
  <g stroke="#34D399" stroke-opacity="0.06" stroke-width="0.5">
    <path d="M0 60 H200 M0 120 H200 M0 180 H200 M0 240 H200 M0 300 H200"/>
    <path d="M40 0 V356 M80 0 V356 M120 0 V356 M160 0 V356"/>
  </g>

  <!-- 顶部栏 -->
  <rect x="0" y="0" width="200" height="3" fill="#34D399"/>
  <text x="12" y="24" font-family="monospace" font-size="7.5" fill="#9CA3AF" letter-spacing="2">TINYHUMANS · OPENHUMAN</text>
  <text x="188" y="24" font-family="monospace" font-size="7.5" fill="#6EE7B7" text-anchor="end" letter-spacing="1">★ 36.3K</text>

  <!-- 中心图形：记忆树大脑 -->
  <g transform="translate(100,110)">
    <!-- 辉光 -->
    <circle r="57" fill="url(#glow)"/>
    <!-- 潜意识扫描环 -->
    <g>
      <ellipse rx="50" ry="18" fill="none" stroke="#34D399" stroke-opacity="0.35" stroke-width="0.8"/>
      <ellipse rx="50" ry="18" fill="none" stroke="#22D3EE" stroke-opacity="0.15" stroke-width="0.5" transform="rotate(60)"/>
      <ellipse rx="50" ry="18" fill="none" stroke="#22D3EE" stroke-opacity="0.15" stroke-width="0.5" transform="rotate(120)"/>
      <!-- 数据点（auto-fetch 20min 喂脑） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="16s" repeatCount="indefinite"/>
        <circle r="3" fill="#6EE7B7" cx="0" cy="-50"><animateTransform attributeName="transform" type="rotate" values="0 0 0;-360 0 0" dur="16s" repeatCount="indefinite"/></circle>
        <circle r="2.6" fill="#22D3EE" cx="43.3" cy="25"><animateTransform attributeName="transform" type="rotate" values="0 0 0;-360 0 0" dur="16s" repeatCount="indefinite"/></circle>
        <circle r="2.6" fill="#A7F3D0" cx="-43.3" cy="25"><animateTransform attributeName="transform" type="rotate" values="0 0 0;-360 0 0" dur="16s" repeatCount="indefinite"/></circle>
        <circle r="2.2" fill="#34D399" cx="-43.3" cy="-25"><animateTransform attributeName="transform" type="rotate" values="0 0 0;-360 0 0" dur="16s" repeatCount="indefinite"/></circle>
      </g>
    </g>

    <!-- 记忆树：从核心长出的树杈 -->
    <g stroke="#34D399" stroke-width="1.3" fill="none" stroke-linecap="round" filter="url(#neon)">
      <!-- 左枝 -->
      <path d="M-8,2 L-26,-14 L-38,-10">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <path d="M-26,-14 L-30,-26">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" begin="0.4s" repeatCount="indefinite"/>
      </path>
      <!-- 右枝 -->
      <path d="M8,2 L28,-10 L40,-6">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
      </path>
      <path d="M28,-10 L34,-24">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
      </path>
      <!-- 顶枝 -->
      <path d="M0,-6 L0,-30">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 记忆叶子（知识点） -->
    <g>
      <circle cx="-38" cy="-10" r="2.6" fill="#34D399"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="-30" cy="-26" r="2.2" fill="#22D3EE"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="-6" r="2.6" fill="#6EE7B7"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="34" cy="-24" r="2.2" fill="#22D3EE"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="-32" r="2.4" fill="#A7F3D0"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- 大脑记忆核 -->
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.07;1" dur="3.6s" repeatCount="indefinite"/>
      <!-- 大脑轮廓（简化脑形） -->
      <path d="M-16,14 Q-22,6 -20,-4 Q-18,-14 -8,-17 Q0,-20 8,-17 Q18,-14 20,-4 Q22,6 16,14 Q8,20 0,18 Q-8,20 -16,14 Z" fill="#0A120E" stroke="url(#coreGrad)" stroke-width="1.4" filter="url(#neon)"/>
      <!-- 脑沟回 -->
      <path d="M-10,2 Q-4,-4 2,0 Q8,4 12,-2" fill="none" stroke="#34D399" stroke-width="1" stroke-opacity="0.8"/>
      <path d="M-8,10 Q0,6 8,10" fill="none" stroke="#34D399" stroke-width="0.9" stroke-opacity="0.6"/>
      <!-- 神经脉冲 -->
      <circle r="1.8" fill="#22D3EE">
        <animateMotion dur="2s" repeatCount="indefinite" path="M-14,4 Q-4,-6 0,0"/>
      </circle>
      <circle r="1.6" fill="#A7F3D0">
        <animateMotion dur="2s" begin="1s" repeatCount="indefinite" path="M14,-2 Q4,8 0,2"/>
      </circle>
    </g>

    <!-- 数据流入脉冲（外部 → 大脑） -->
    <circle r="1.8" fill="#6EE7B7" filter="url(#neon)">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M0,-50 Q0,-30 0,-20"/>
    </circle>
    <circle r="1.6" fill="#22D3EE" filter="url(#neon)">
      <animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M-43,25 Q-20,10 -4,2"/>
    </circle>
    <circle r="1.6" fill="#A7F3D0" filter="url(#neon)">
      <animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M43,25 Q18,12 6,4"/>
    </circle>
  </g>

  <!-- 标题区 -->
  <text x="100" y="226" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#F4F4F5" text-anchor="middle" letter-spacing="0.5">OpenHuman</text>
  <text x="100" y="250" font-family="monospace" font-size="7.5" fill="#34D399" text-anchor="middle" letter-spacing="1.5">PERSONAL AI SUPER INTELLIGENCE</text>
  <text x="100" y="268" font-family="system-ui,sans-serif" font-size="8" fill="#9CA3AF" text-anchor="middle">大脑 + 编排器 + 研究员 · 本地优先</text>

  <!-- 数据条 -->
  <rect x="24" y="288" width="152" height="24" rx="12" fill="#34D399" fill-opacity="0.13" stroke="#34D399" stroke-opacity="0.5" stroke-width="0.7"/>
  <text x="100" y="304" font-family="monospace" font-size="8" fill="#6EE7B7" text-anchor="middle" letter-spacing="0.8">36.3K★ · 9D · 90K SKILLS</text>

  <!-- 底部品牌 -->
  <text x="100" y="338" font-family="monospace" font-size="6.5" fill="#5E6884" text-anchor="middle" letter-spacing="1">MIND RESONANCE · 反共识观察</text>
</svg>
