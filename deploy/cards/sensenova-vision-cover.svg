<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 356" width="200" height="356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8ff00"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="neon"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="200" height="356" fill="url(#bg)" rx="4"/>
  <!-- Grid -->
  <g opacity=".12" stroke="#c8ff00" stroke-width=".3">
    <line x1="0" y1="60" x2="200" y2="60"/><line x1="0" y1="80" x2="200" y2="80"/>
    <line x1="0" y1="100" x2="200" y2="100"/><line x1="0" y1="120" x2="200" y2="120"/>
    <line x1="0" y1="140" x2="200" y2="140"/><line x1="0" y1="160" x2="200" y2="160"/>
    <line x1="40" y1="50" x2="40" y2="180"/><line x1="80" y1="50" x2="80" y2="180"/>
    <line x1="120" y1="50" x2="120" y2="180"/><line x1="160" y1="50" x2="160" y2="180"/>
  </g>
  <!-- Camera lens -->
  <g transform="translate(100,85)" stroke="#c8ff00" fill="none" stroke-width="1.6" filter="url(#neon)">
    <rect x="-32" y="-22" width="64" height="44" rx="5" opacity=".8"/>
    <circle cx="0" cy="0" r="13" opacity=".9"/><circle cx="0" cy="0" r="6" opacity=".5"/>
    <circle cx="0" cy="0" r="2.5" fill="#c8ff00" opacity=".8"/>
    <rect x="20" y="-16" width="6" height="4" rx="1"/>
  </g>
  <!-- Neural dots -->
  <g opacity=".5" stroke="#00e5ff" stroke-width=".5" fill="#c8ff00">
    <circle cx="35" cy="50" r="2"/><circle cx="165" cy="50" r="2"/>
    <circle cx="30" cy="130" r="1.5"/><circle cx="170" cy="130" r="1.5"/>
    <line x1="35" y1="50" x2="165" y2="50" opacity=".2"/>
    <line x1="30" y1="130" x2="170" y2="130" opacity=".2"/>
  </g>
  <!-- Wave -->
  <g transform="translate(20,200)" opacity=".2" fill="none" stroke="#c8ff00" stroke-width=".7">
    <polyline points="0,0 30,-8 50,4 80,-12 110,2 140,-6 160,8"/>
    <polyline points="0,8 30,0 50,12 80,-4 110,10 140,2 160,16" opacity=".1" stroke="#00e5ff"/>
  </g>
  <!-- Seg mask -->
  <g transform="translate(100,245)" opacity=".25" stroke="#00e5ff" stroke-width=".4" fill="none">
    <rect x="-35" y="-25" width="70" height="50" rx="2"/>
    <ellipse cx="0" cy="0" rx="18" ry="12" opacity=".35"/>
  </g>
  <!-- Title -->
  <text x="100" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#c8ff00" letter-spacing="-.3">SenseNova-Vision</text>
  <text x="100" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6.5" fill="#8892b0" letter-spacing=".2">7B · MoT · Unified Vision</text>
  <rect x="60" y="313" width="80" height="2" rx="1" fill="url(#glow)" opacity=".5"/>
</svg>
