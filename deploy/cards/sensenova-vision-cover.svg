<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 356" width="200" height="356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8ff00"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="356" fill="url(#bg)" rx="4"/>

  <!-- Grid pattern (data visualization aesthetic) -->
  <g opacity="0.15" stroke="#c8ff00" stroke-width="0.3">
    <line x1="0" y1="80" x2="200" y2="80"/>
    <line x1="0" y1="100" x2="200" y2="100"/>
    <line x1="0" y1="120" x2="200" y2="120"/>
    <line x1="0" y1="140" x2="200" y2="140"/>
    <line x1="0" y1="160" x2="200" y2="160"/>
    <line x1="0" y1="180" x2="200" y2="180"/>
    <line x1="40" y1="60" x2="40" y2="200"/>
    <line x1="80" y1="60" x2="80" y2="200"/>
    <line x1="120" y1="60" x2="120" y2="200"/>
    <line x1="160" y1="60" x2="160" y2="200"/>
  </g>

  <!-- Wireframe camera/lens icon (vision theme) -->
  <g transform="translate(100,90)" stroke="#c8ff00" fill="none" stroke-width="1.5" filter="url(#neon)">
    <!-- Camera body -->
    <rect x="-30" y="-20" width="60" height="40" rx="5" opacity="0.8"/>
    <!-- Lens -->
    <circle cx="0" cy="0" r="12" opacity="0.9"/>
    <circle cx="0" cy="0" r="6" opacity="0.6"/>
    <circle cx="0" cy="0" r="2" fill="#c8ff00" opacity="0.8"/>
    <!-- Flash -->
    <rect x="18" y="-16" width="6" height="4" rx="1" opacity="0.7"/>
  </g>

  <!-- Neural connection dots (AI vision) -->
  <g opacity="0.6" stroke="#00e5ff" stroke-width="0.6" fill="#c8ff00">
    <circle cx="45" cy="55" r="2"/>
    <circle cx="155" cy="55" r="2"/>
    <circle cx="35" cy="130" r="1.5"/>
    <circle cx="165" cy="130" r="1.5"/>
    <circle cx="45" cy="170" r="1.5"/>
    <circle cx="155" cy="170" r="1.5"/>
    <line x1="45" y1="55" x2="155" y2="55" opacity="0.3"/>
    <line x1="35" y1="130" x2="165" y2="130" opacity="0.3"/>
  </g>

  <!-- Lines of "code" visual (MoT architecture) -->
  <g transform="translate(20, 210)" opacity="0.25" fill="none" stroke="#c8ff00" stroke-width="0.8">
    <polyline points="0,0 30,-8 50,4 80,-12 110,2 140,-6 160,8"/>
    <polyline points="0,10 30,2 50,14 80,-2 110,12 140,4 160,18" opacity="0.15" stroke="#00e5ff"/>
    <polyline points="0,20 30,12 50,24 80,8 110,22 140,14 160,28" opacity="0.1"/>
  </g>

  <!-- Abstract segmentation/depth map pattern -->
  <g transform="translate(100, 250)" opacity="0.3" stroke="#00e5ff" stroke-width="0.5" fill="none">
    <rect x="-40" y="-30" width="80" height="60" rx="2"/>
    <ellipse cx="0" cy="0" rx="20" ry="15" opacity="0.4"/>
    <path d="M-30,-15 Q-10,-25 10,-10 Q30,0 20,15 Q0,20 -15,10 Z" opacity="0.3"/>
  </g>

  <!-- Title area -->
  <text x="100" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#c8ff00" letter-spacing="-0.3">SenseNova-Vision</text>
  <text x="100" y="306" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#8892b0" letter-spacing="0.2">7B · MoT · Unified Vision</text>

  <!-- Bottom accent line -->
  <rect x="60" y="320" width="80" height="2" rx="1" fill="url(#glow)" opacity="0.6"/>
</svg>
