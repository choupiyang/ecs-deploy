<svg xmlns="http://www.w3.org/2000/svg" width="200" height="356" viewBox="0 0 200 356" role="img" aria-label="DeepSeek-Reasonix">
  <title>DeepSeek-Reasonix</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/>
      <stop offset="0.55" stop-color="#151C2E"/>
      <stop offset="1" stop-color="#070A12"/>
    </linearGradient>
    <linearGradient id="rx-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.3" stop-color="#67E8F9"/>
      <stop offset="0.6" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#F0ABFC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0ABFC" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#F0ABFC" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="#67E8F9" stroke-opacity="0.06" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)"/>
  <circle cx="100" cy="130" r="80" fill="url(#glow)"/>
  <circle cx="140" cy="150" r="50" fill="url(#glow2)"/>
  <g font-family="monospace" font-size="5.2" letter-spacing="1.6" fill="#6B7A99">
  </g>
  <!-- 后窗口 -->
  <g transform="translate(56,64) rotate(-7 52 52)">
    <rect x="0" y="0" width="104" height="80" rx="10" fill="#0C1322" stroke="#A5B4FC" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="14" cy="13" r="2.5" fill="#FF5F57"/>
    <circle cx="24" cy="13" r="2.5" fill="#FFB020"/>
    <circle cx="34" cy="13" r="2.5" fill="#28C840"/>
    <line x1="12" y1="24" x2="92" y2="24" stroke="#A5B4FC" stroke-opacity="0.2" stroke-width="0.8"/>
  </g>
  <g transform="translate(42,74) rotate(5 58 58)" filter="url(#neon)">
    <rect x="0" y="0" width="116" height="92" rx="10" fill="#0A0F1C" stroke="#67E8F9" stroke-opacity="0.55" stroke-width="1.2"/>
    <circle cx="15" cy="14" r="3" fill="#FF5F57"/>
    <circle cx="26" cy="14" r="3" fill="#FFB020"/>
    <circle cx="37" cy="14" r="3" fill="#28C840"/>
    <line x1="12" y1="26" x2="104" y2="26" stroke="#67E8F9" stroke-opacity="0.25" stroke-width="0.8"/>
    <rect x="13" y="36" width="74" height="4" rx="2" fill="url(#rx-grad)" fill-opacity="0.75">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="13" y="46" width="52" height="4" rx="2" fill="url(#rx-grad)" fill-opacity="0.5">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.8s" repeatCount="indefinite" begin="0.9s"/>
    </rect>
    <rect x="13" y="56" width="62" height="4" rx="2" fill="url(#rx-grad)" fill-opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.8s" repeatCount="indefinite" begin="1.8s"/>
    </rect>
    <rect x="13" y="66" width="7" height="11" fill="#67E8F9">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g font-family="monospace" font-size="5.5">
    <rect x="42" y="176" width="78" height="13" rx="4" fill="#5EEAD4" fill-opacity="0.08" stroke="#5EEAD4" stroke-opacity="0.4" stroke-width="0.7"/>
    <circle cx="51" cy="182.5" r="2.2" fill="#5EEAD4">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="58" y="185" fill="#5EEAD4">checkpoint #14</text>
  </g>
  <g font-family="monospace" font-size="5.5">
    <rect x="118" y="176" width="56" height="13" rx="4" fill="#F0ABFC" fill-opacity="0.08" stroke="#F0ABFC" stroke-opacity="0.4" stroke-width="0.7"/>
    <text x="125" y="185" fill="#F0ABFC">$0.043 · 18m</text>
  </g>
  <rect x="0" y="296" width="200" height="60" fill="url(#bg)" fill-opacity="0.92"/>
  <line x1="10" y1="296" x2="190" y2="296" stroke="#67E8F9" stroke-opacity="0.4" stroke-width="0.8"/>

</svg>
