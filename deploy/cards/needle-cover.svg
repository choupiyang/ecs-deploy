<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="356" viewBox="0 0 200 356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F160F"/>
      <stop offset="1" stop-color="#060B06"/>
    </linearGradient>
    <linearGradient id="ndGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6E07E"/>
      <stop offset="1" stop-color="#4A8F2E"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#B8E69A"/>
      <stop offset="0.55" stop-color="#7CBE52"/>
      <stop offset="1" stop-color="#3B7A24"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#24301F" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)" opacity="0.35"/>

  <!-- 顶部栏 -->
  <rect x="0" y="0" width="200" height="2" fill="url(#ndGrad)" opacity="0.85"/>
  <text x="16" y="24" font-family="monospace" font-size="7" fill="#6E8064" letter-spacing="2">CACTUS · NEEDLE</text>
  <text x="184" y="24" font-family="monospace" font-size="7" fill="#7CBE52" text-anchor="end">14MB</text>

  <!-- 中心: 针尖命中（轨道工具 → 中心核） -->
  <g transform="translate(100,132)">
    <!-- 轨道环 -->
    <g>
      <circle r="52" fill="none" stroke="#7CBE52" stroke-width="1" stroke-dasharray="4 5" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle r="39" fill="none" stroke="#4A8F2E" stroke-width="0.8" stroke-dasharray="3 6" opacity="0.45">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="20s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- 径向丝 -->
    <g stroke="#24301F" stroke-width="0.7" opacity="0.7">
      <line x1="0" y1="-52" x2="0" y2="52"/>
      <line x1="-52" y1="0" x2="52" y2="0"/>
      <line x1="-37" y1="-37" x2="37" y2="37"/>
      <line x1="37" y1="-37" x2="-37" y2="37"/>
    </g>

    <!-- 针（垂直插入，指向核） -->
    <g opacity="0.9">
      <rect x="-1" y="-56" width="2" height="44" fill="#A6E07E">
        <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
      </rect>
      <path d="M0,-12 L-2,-16 M0,-12 L2,-16 M0,-12 L-3,-14 M0,-12 L3,-14" stroke="#A6E07E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    </g>

    <!-- 中心核 -->
    <g filter="url(#glow)">
      <circle r="26" fill="url(#coreGrad)">
        <animate attributeName="r" values="26;27.5;26" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <!-- 针孔 -->
      <circle r="2.5" fill="#0A120A"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="13" fill="#0A120A" font-weight="bold">14</text>
      <text x="0" y="13" text-anchor="middle" font-family="monospace" font-size="5" fill="#1E3312" letter-spacing="1">MB</text>
    </g>

    <!-- 轨道工具位（模拟海量工具） -->
    <g font-size="8" text-anchor="middle">
      <text y="2">⚙️
        <animateMotion dur="7s" repeatCount="indefinite" path="M0,-42 A42,42 0 1,0 -0.01,-42 Z"/>
      </text>
      <text y="2">🔍
        <animateMotion dur="8s" repeatCount="indefinite" path="M0,-30 A30,30 0 0,1 -0.01,-30 Z" begin="1.4s"/>
      </text>
      <text y="2">🧮
        <animateMotion dur="9s" repeatCount="indefinite" path="M0,-52 A52,52 0 1,1 -0.01,-52 Z" begin="3s"/>
      </text>
    </g>
  </g>

  <!-- 标题区 (Semantica 式) -->
  <text x="100" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#EDF2E8">Needle<tspan x="100" dy="19">2</tspan></text>
  <text x="100" y="276" text-anchor="middle" font-family="monospace" font-size="6" fill="#7CBE52" letter-spacing="1.5">ON-DEVICE AGENTIC LLM</text>
  <text x="100" y="290" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#A8BBA0">45M 参数 · 14MB · 大海捞针精准调工具</text>

  <!-- 数据条 -->
  <rect x="24" y="306" width="152" height="24" rx="12" fill="#0E140E" stroke="#24301F" stroke-width="0.8"/>
  <text x="100" y="322" text-anchor="middle" font-family="monospace" font-size="7.2" fill="#EDF2E8">14MB · 45M · 6.1K★ · 28MB</text>

  <!-- 底部 -->
  <text x="100" y="338" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#6E8064" letter-spacing="1">MIND RESONANCE · 反共识观察</text>
</svg>
