<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 356" width="200" height="356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0814"/>
      <stop offset="50%" stop-color="#12101F"/>
      <stop offset="100%" stop-color="#1A1430"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE98A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#FFE98A"/>
      <stop offset="0.55" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#6E40C9"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#2A2350" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)" opacity="0.5"/>

  <!-- 顶部栏 -->
  <rect x="0" y="0" width="200" height="2" fill="url(#goldGrad)" opacity="0.8"/>
  <text x="16" y="24" font-family="monospace" font-size="7" fill="#6E6490" letter-spacing="2">NOUS RESEARCH</text>
  <text x="184" y="24" font-family="monospace" font-size="7" fill="#FFD700" text-anchor="end">230K★</text>

  <!-- 中心: 记忆核 + 学习闭环轨道（自改进循环） -->
  <g transform="translate(100,126)">
    <!-- 外轨道（虚线，代表学习循环） -->
    <circle r="58" fill="none" stroke="#FFD700" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.45">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="44" fill="none" stroke="#8B5CF6" stroke-width="0.7" stroke-dasharray="2 4" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="30" fill="none" stroke="#FFE98A" stroke-width="0.5" stroke-dasharray="1.5 3" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- 轨道卫星：技能/记忆/平台/模型（金点） -->
    <circle cx="0" cy="-58" r="5" fill="url(#goldGrad)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="58" cy="0" r="4.2" fill="#8B5CF6" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="44" r="4.5" fill="url(#goldGrad)" filter="url(#glow)" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-44" cy="0" r="3.8" fill="#A78BFA" filter="url(#glow)" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- 连接线（核心→卫星，知识流动） -->
    <line x1="0" y1="0" x2="0" y2="-58" stroke="#FFD700" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="58" y2="0" stroke="#8B5CF6" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="0" y2="44" stroke="#FFD700" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="-44" y2="0" stroke="#8B5CF6" stroke-width="0.5" opacity="0.3"/>

    <!-- 记忆核心（脉冲） -->
    <circle r="16" fill="url(#coreGrad)" filter="url(#glow)">
      <animate attributeName="r" values="14;17;14" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="16" fill="none" stroke="#FFE98A" stroke-width="0.8" opacity="0.6">
      <animate attributeName="r" values="16;25;16" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <!-- 核内 ☤（Hermes 权杖符号：双蛇+杖） -->
    <g stroke="#1A1430" stroke-width="1.6" fill="none" stroke-linecap="round">
      <line x1="0" y1="-9" x2="0" y2="9"/>
      <path d="M-5 -5 C -3 -1, 3 -1, 5 -5" opacity="0.85"/>
      <path d="M-5 5 C -3 1, 3 1, 5 5" opacity="0.85"/>
      <circle cx="0" cy="-9" r="1.8" fill="#1A1430"/>
    </g>
  </g>

  <!-- 标题区 (Semantica) -->
  <text x="100" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#F0EDF8">Hermes Agent</text>
  <text x="100" y="252" text-anchor="middle" font-family="monospace" font-size="7" fill="#FFD700" letter-spacing="1.5">SELF-IMPROVING AI AGENT</text>
  <text x="100" y="268" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#9A92B8">会成长的 Agent · 记忆技能跨会话累积</text>

  <!-- 数据条 -->
  <rect x="24" y="288" width="152" height="24" rx="12" fill="#141024" stroke="#2A2350" stroke-width="0.8"/>
  <text x="100" y="304" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#F0EDF8">230K★ · MIT · Nous Research</text>

  <!-- 底部 -->
  <text x="100" y="338" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#6E6490" letter-spacing="1">MIND RESONANCE · 反共识观察</text>
</svg>
