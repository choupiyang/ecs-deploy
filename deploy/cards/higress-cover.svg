<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="356" viewBox="0 0 200 356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1A33"/>
      <stop offset="1" stop-color="#0B1530"/>
    </linearGradient>
    <linearGradient id="hgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AA8FF"/>
      <stop offset="1" stop-color="#0E5CAB"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#8FC4FF"/>
      <stop offset="0.55" stop-color="#1E8CFE"/>
      <stop offset="1" stop-color="#0E4D94"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#1A3157" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)" opacity="0.3"/>

  <!-- 顶部栏 -->
  <rect x="0" y="0" width="200" height="2" fill="url(#hgGrad)" opacity="0.9"/>
  <text x="16" y="24" font-family="monospace" font-size="7" fill="#5F7B9E" letter-spacing="2">CNCF · HIGRESS</text>
  <text x="184" y="24" font-family="monospace" font-size="7" fill="#5AA8FF" text-anchor="end">AI GATEWAY</text>

  <!-- 中心: 异构汇聚网关（模型节点 → 中心核） -->
  <g transform="translate(100,132)">
    <!-- 轨道环 -->
    <circle r="50" fill="none" stroke="#1E8CFE" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle r="37" fill="none" stroke="#2E6BB5" stroke-width="0.8" stroke-dasharray="3 6" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="19s" repeatCount="indefinite"/>
    </circle>
    <!-- 径向丝 -->
    <g stroke="#1A3157" stroke-width="0.7" opacity="0.8">
      <line x1="0" y1="-50" x2="0" y2="50"/>
      <line x1="-50" y1="0" x2="50" y2="0"/>
      <line x1="-35" y1="-35" x2="35" y2="35"/>
      <line x1="35" y1="-35" x2="-35" y2="35"/>
    </g>

    <!-- 中心核（45°方块 = 网关） -->
    <g transform="rotate(45)" filter="url(#glow)">
      <rect x="-18" y="-18" width="36" height="36" rx="8" fill="url(#coreGrad)">
        <animate attributeName="width" values="36;38;36" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="height" values="36;38;36" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="x" values="-18;-19;-18" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-18;-19;-18" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="rotate(-45)">
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff" font-weight="bold">⚡</text>
    </g>

    <!-- 轨道模型节点（异构汇聚） -->
    <g font-size="8" text-anchor="middle">
      <rect x="-9" y="-9" width="18" height="18" rx="5" fill="#13305A" stroke="#1E8CFE" stroke-width="0.8"/>
      <text y="3">🤖
        <animateMotion dur="7s" repeatCount="indefinite" path="M0,-40 A40,40 0 1,0 -0.01,-40 Z"/>
      </text>
    </g>
    <g font-size="8" text-anchor="middle">
      <rect x="-9" y="-9" width="18" height="18" rx="5" fill="#13305A" stroke="#5AA8FF" stroke-width="0.8"/>
      <text y="3">🧠
        <animateMotion dur="8s" repeatCount="indefinite" path="M0,-29 A29,29 0 0,1 -0.01,-29 Z" begin="1.3s"/>
      </text>
    </g>
    <g font-size="8" text-anchor="middle">
      <rect x="-9" y="-9" width="18" height="18" rx="5" fill="#13305A" stroke="#7F8CF7" stroke-width="0.8"/>
      <text y="3">🔌
        <animateMotion dur="9s" repeatCount="indefinite" path="M0,-50 A50,50 0 1,1 -0.01,-50 Z" begin="2.6s"/>
      </text>
    </g>
  </g>

  <!-- 标题区 -->
  <text x="100" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#EDF4FF">Higress</text>
  <text x="100" y="272" text-anchor="middle" font-family="monospace" font-size="6" fill="#5AA8FF" letter-spacing="1.5">AI NATIVE API GATEWAY</text>
  <text x="100" y="286" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#9AB4DC">100+ LLM · 托管 MCP · CNCF</text>

  <!-- 数据条 -->
  <rect x="24" y="300" width="152" height="24" rx="12" fill="#0D1E3A" stroke="#1A3157" stroke-width="0.8"/>
  <text x="100" y="316" text-anchor="middle" font-family="monospace" font-size="7" fill="#EDF4FF">9.1K★ · 数十万 QPS · 10×</text>

  <!-- 底部 -->
  <text x="100" y="338" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#5F7B9E" letter-spacing="1">MIND RESONANCE · 反共识观察</text>
</svg>
