<svg xmlns="http://www.w3.org/2000/svg" width="200" height="356" viewBox="0 0 200 356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070D1A"/>
      <stop offset="1" stop-color="#0C1626"/>
    </linearGradient>
    <linearGradient id="dolBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8D4FF"/>
      <stop offset="0.55" stop-color="#4D9BFF"/>
      <stop offset="1" stop-color="#1D5AB5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4D9BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4D9BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#4D9BFF" stroke-width="0.4" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)"/>
  <circle cx="100" cy="112" r="88" fill="url(#glow)"/>

  <!-- 顶部栏 -->
  <rect x="0" y="0" width="200" height="2" fill="#4D9BFF" opacity="0.8"/>
  <text x="14" y="22" font-family="monospace" font-size="7" fill="#7E8AA3" letter-spacing="2">DEEPSEEK HARNESS</text>
  <text x="186" y="22" font-family="monospace" font-size="7" fill="#8EC3FF" text-anchor="end">3.8K★</text>

  <!-- 海豚 + 水面 -->
  <g transform="translate(100,108)">
    <!-- 水面波纹（两条，反向循环） -->
    <g opacity="0.5">
      <path d="M-34 22 Q-26 18 -18 22 T-2 22 T14 22 T30 22 T46 22" stroke="#4D9BFF" stroke-width="1.3" fill="none">
        <animate attributeName="d" dur="2.8s" repeatCount="indefinite"
          values="M-34 22 Q-26 18 -18 22 T-2 22 T14 22 T30 22 T46 22;M-34 22 Q-26 26 -18 22 T-2 22 T14 22 T30 22 T46 22;M-34 22 Q-26 18 -18 22 T-2 22 T14 22 T30 22 T46 22"/>
      </path>
      <path d="M-40 27 Q-32 23 -24 27 T-8 27 T8 27 T24 27 T40 27 T56 27" stroke="#8EC3FF" stroke-width="1" fill="none" opacity="0.6">
        <animate attributeName="d" dur="3.6s" repeatCount="indefinite"
          values="M-40 27 Q-32 23 -24 27 T-8 27 T8 27 T24 27 T40 27 T56 27;M-40 27 Q-32 31 -24 27 T-8 27 T8 27 T24 27 T40 27 T56 27;M-40 27 Q-32 23 -24 27 T-8 27 T8 27 T24 27 T40 27 T56 27"/>
      </path>
    </g>
    <!-- 海豚整体游动 -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0;0 2;0 0" dur="3.2s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-2 44 15;1 44 15;-1 44 15;-2 44 15" dur="3.2s" repeatCount="indefinite"/>
        <!-- 身体（向左游动，宽度约 84） -->
        <path d="M4 15 C12 3 30 -2 46 0 C60 2 74 7 80 12 L86 6 L88 15 L86 24 L80 18 C72 23 58 26 44 25 C28 24 14 19 6 16 Z" fill="url(#dolBody)"/>
        <!-- 背鳍 -->
        <path d="M42 -1 C44 -9 50 -12 53 -8 C50 -5 48 -2 47 0 Z" fill="#2E6FD6"/>
        <!-- 胸鳍 -->
        <path d="M30 17 C26 21 22 23 18 21 C24 18 27 16 30 17 Z" fill="#3A7BE0"/>
        <!-- 尾鳍（摆动） -->
        <g transform-origin="84 12">
          <path d="M82 12 L92 2 L92 22 Z" fill="#3A7BE0">
            <animateTransform attributeName="transform" type="rotate" values="0 84 12;-14 84 12;0 84 12" dur="1.6s" repeatCount="indefinite"/>
          </path>
        </g>
        <!-- 眼睛 -->
        <circle cx="12" cy="13" r="2.2" fill="#0A1A3A"/>
        <circle cx="12.8" cy="12.4" r="0.8" fill="#fff"/>
        <!-- 嘴线（微笑） -->
        <path d="M4 16 C8 17 12 17.5 16 17" stroke="#1D5AB5" stroke-width="1" fill="none" stroke-linecap="round"/>
        <!-- 腮红（可爱） -->
        <circle cx="20" cy="16" r="2.6" fill="#FF9EB5" opacity="0.45"/>
      </g>
    </g>
  </g>

  <!-- 标题区 -->

  <!-- 数据条 -->

  <!-- 底部 -->
  <!-- 底部标题区（与首页 HTML 层标题不冲突） -->
  <rect x="0" y="316" width="200" height="40" fill="#0A1322" opacity="0.92"/>
  <text x="16" y="336" font-family="monospace" font-size="9" fill="#E8F6F1" font-weight="bold">DeepSeek Harness</text>
  <text x="16" y="348" font-family="monospace" font-size="6.5" fill="#5A6078">EVERYTHING IS A PLUGIN</text>
  <rect x="150" y="326" width="36" height="17" rx="3" fill="none" stroke="#4D9BFF" stroke-width="1"/>
  <text x="168" y="338" font-family="monospace" font-size="6.5" fill="#4D9BFF" text-anchor="middle">300+ plugins</text>
</svg>