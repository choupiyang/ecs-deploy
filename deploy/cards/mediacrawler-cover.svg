<svg xmlns="http://www.w3.org/2000/svg" width="200" height="356" viewBox="0 0 200 356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08100C"/>
      <stop offset="1" stop-color="#0D1B2A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5A0"/>
      <stop offset="1" stop-color="#5CFFC4"/>
    </linearGradient>
    <radialGradient id="bodyGrad" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#7DF5DC"/>
      <stop offset="0.5" stop-color="#00E5A0"/>
      <stop offset="1" stop-color="#0A5A48"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#123048" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)" opacity="0.5"/>
  <rect x="0" y="0" width="200" height="2" fill="url(#accentGrad)" opacity="0.8"/>
  <g transform="translate(100,128)">
    <rect x="-48" y="-42" width="96" height="84" rx="10" fill="rgba(13,26,20,0.9)" stroke="#00E5A0" stroke-width="1.2" opacity="0.9">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </rect>
    <circle cx="-36" cy="-33" r="2.5" fill="#FF5F56"/>
    <circle cx="-29" cy="-33" r="2.5" fill="#FFBD2E"/>
    <circle cx="-22" cy="-33" r="2.5" fill="#27C93F"/>
    <line x1="-48" y1="-27" x2="48" y2="-27" stroke="#00E5A0" stroke-width="0.6" opacity="0.25"/>
    <rect x="-36" y="-17" width="42" height="3.5" rx="1.75" fill="#8FA8C8" opacity="0.22"/>
    <rect x="-36" y="-8" width="52" height="3.5" rx="1.75" fill="#00E5A0" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="-36" y="1" width="36" height="3.5" rx="1.75" fill="#8FA8C8" opacity="0.22"/>
    <rect x="-36" y="10" width="48" height="3.5" rx="1.75" fill="#00E5A0" opacity="0.35">
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="2.1s" begin="0.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="-36" y="19" width="30" height="3.5" rx="1.75" fill="#8FA8C8" opacity="0.22"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-34,0;-34,3;-18,0;0,2;18,0;18,3;0,0;-18,2" dur="7s" repeatCount="indefinite"/>
      <g stroke="#00E5A0" stroke-width="1.4" stroke-linecap="round">
        <line x1="-4" y1="-4" x2="-11" y2="-8"><animateTransform attributeName="transform" type="rotate" values="10 -4 -4;-14 -4 -4" dur="0.45s" repeatCount="indefinite"/></line>
        <line x1="-4" y1="0" x2="-11" y2="4"><animateTransform attributeName="transform" type="rotate" values="-10 -4 0;14 -4 0" dur="0.45s" repeatCount="indefinite"/></line>
        <line x1="-4" y1="4" x2="-11" y2="9"><animateTransform attributeName="transform" type="rotate" values="10 -4 4;-14 -4 4" dur="0.45s" begin="0.225s" repeatCount="indefinite"/></line>
        <line x1="-4" y1="8" x2="-11" y2="13"><animateTransform attributeName="transform" type="rotate" values="-10 -4 8;14 -4 8" dur="0.45s" begin="0.225s" repeatCount="indefinite"/></line>
        <line x1="5" y1="-4" x2="12" y2="-8"><animateTransform attributeName="transform" type="rotate" values="-10 5 -4;14 5 -4" dur="0.45s" repeatCount="indefinite"/></line>
        <line x1="5" y1="0" x2="12" y2="4"><animateTransform attributeName="transform" type="rotate" values="10 5 0;-14 5 0" dur="0.45s" repeatCount="indefinite"/></line>
        <line x1="5" y1="4" x2="12" y2="9"><animateTransform attributeName="transform" type="rotate" values="-10 5 4;14 5 4" dur="0.45s" begin="0.225s" repeatCount="indefinite"/></line>
        <line x1="5" y1="8" x2="12" y2="13"><animateTransform attributeName="transform" type="rotate" values="10 5 8;-14 5 8" dur="0.45s" begin="0.225s" repeatCount="indefinite"/></line>
      </g>
      <ellipse cx="0" cy="2" rx="6.5" ry="5.5" fill="url(#bodyGrad)" filter="url(#glow)"/>
      <circle cx="8.5" cy="1" r="3.5" fill="#00E5A0"/>
      <circle cx="9.8" cy="0.2" r="0.9" fill="#fff"/>
    </g>
    <line x1="0" y1="-40" x2="0" y2="-26" stroke="#00E5A0" stroke-width="0.8" opacity="0.5"/>
    <circle r="2.5" fill="#5CFFC4" opacity="0">
      <animate attributeName="cy" values="-24;8" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-10" r="2" fill="#FFC53D" opacity="0">
      <animate attributeName="cy" values="-24;18" dur="3.1s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="3.1s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>


  <!-- 底部标题区（与首页 HTML 层标题不冲突） -->
  <rect x="150" y="326" width="36" height="17" rx="3" fill="none" stroke="#00E5A0" stroke-width="1"/>
</svg>