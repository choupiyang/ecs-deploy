<svg xmlns="http://www.w3.org/2000/svg" width="200" height="356" viewBox="0 0 200 356" role="img" aria-label="Agent Plugins">
  <title>Agent Plugins</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#161B22"/>
      <stop offset="1" stop-color="#060A0F"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ECBFF"/>
      <stop offset="0.45" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#1F6FEB"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3FB950" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3FB950" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonBig" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="#58A6FF" stroke-opacity="0.06" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)"/>
  <circle cx="100" cy="124" r="80" fill="url(#glow)"/>
  <circle cx="100" cy="124" r="48" fill="url(#glow2)"/>
  <g font-family="monospace" font-size="5.2" letter-spacing="1.6" fill="#5B6B7E">
  </g>
  <!-- 顶面 -->
  <polygon points="100,64 134,80 100,96 66,80" fill="#1F6FEB" fill-opacity="0.28" stroke="#58A6FF" stroke-opacity="0.7" stroke-width="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="3.2s" repeatCount="indefinite"/>
  </polygon>
  <text x="100" y="82" text-anchor="middle" font-family="monospace" font-size="5" fill="#9ECBFF" fill-opacity="0.85">
    plugin.json
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="3.2s" repeatCount="indefinite"/>
  </text>
  <polygon points="134,80 134,122 100,138 100,96" fill="#58A6FF" fill-opacity="0.14" stroke="#58A6FF" stroke-opacity="0.5" stroke-width="0.8"/>
  <text x="117" y="112" text-anchor="middle" font-family="monospace" font-size="4.6" fill="#7FA8D9" transform="rotate(-15 117 110)">skills/</text>
  <polygon points="66,80 66,122 100,138 100,96" fill="#3FB950" fill-opacity="0.12" stroke="#3FB950" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="83" y="112" text-anchor="middle" font-family="monospace" font-size="4.6" fill="#6FBF8A" transform="rotate(15 83 110)">mcp.json</text>
  <ellipse cx="100" cy="130" rx="40" ry="10" fill="#58A6FF" fill-opacity="0.10">
    <animate attributeName="rx" values="40;44;40" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="100" cy="124" rx="52" ry="16" fill="none" stroke="#58A6FF" stroke-opacity="0.2" stroke-width="0.7" stroke-dasharray="3 6">
    <animateTransform attributeName="transform" type="rotate" from="0 100 124" to="360 100 124" dur="26s" repeatCount="indefinite"/>
  </ellipse>
  <g filter="url(#neon)">
    <rect x="100" y="124" width="5" height="5" rx="1" fill="#58A6FF" fill-opacity="0.9">
      <animate attributeName="x" values="140;100;100" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="110;124;124" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="100" y="124" width="4" height="4" rx="1" fill="#3FB950" fill-opacity="0.9">
      <animate attributeName="x" values="58;100;100" dur="5.4s" repeatCount="indefinite" begin="0.9s"/>
      <animate attributeName="y" values="112;124;124" dur="5.4s" repeatCount="indefinite" begin="0.9s"/>
      <animate attributeName="opacity" values="0;1;0" dur="5.4s" repeatCount="indefinite" begin="0.9s"/>
    </rect>
    <rect x="100" y="124" width="3.5" height="3.5" rx="1" fill="#D29922" fill-opacity="0.9">
      <animate attributeName="x" values="132;100;100" dur="6.2s" repeatCount="indefinite" begin="1.7s"/>
      <animate attributeName="y" values="140;124;124" dur="6.2s" repeatCount="indefinite" begin="1.7s"/>
      <animate attributeName="opacity" values="0;1;0" dur="6.2s" repeatCount="indefinite" begin="1.7s"/>
    </rect>
  </g>
  <g font-family="monospace" font-size="4.4" fill="#8B949E">
    <text x="160" y="84" fill="#6FBF8A">SKILL.md</text>
    <text x="28" y="92" fill="#7FA8D9">stdio</text>
    <text x="158" y="152" fill="#7FA8D9">${PLUGIN_ROOT}</text>
    <text x="26" y="158" fill="#6FBF8A">streamable-http</text>
  </g>
  <g fill="#58A6FF" fill-opacity="0.7">
    <circle cx="172" cy="60" r="1.6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="26" cy="66" r="1.3">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="174" cy="132" r="1.4" fill="#3FB950">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <circle cx="24" cy="136" r="1.6">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite" begin="1.8s"/>
    </circle>
  </g>
  <rect x="0" y="296" width="200" height="60" fill="url(#bg)" fill-opacity="0.92"/>
  <line x1="10" y1="296" x2="190" y2="296" stroke="#58A6FF" stroke-opacity="0.4" stroke-width="0.8"/>

</svg>
