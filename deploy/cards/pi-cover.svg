<svg xmlns="http://www.w3.org/2000/svg" width="200" height="356" viewBox="0 0 200 356" role="img" aria-label="Pi — AI Agent 工具包">
  <title>Pi — AI Agent 工具包 · 生态中心</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#09090B"/>
      <stop offset="0.55" stop-color="#111113"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8B63E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E8B63E" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="#E8B63E" stroke-opacity="0.05" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)"/>
  <circle cx="100" cy="130" r="85" fill="url(#glow)"/>

  <!-- 顶部栏 -->
  <rect x="0" y="0" width="200" height="2" fill="#E8B63E" opacity="0.8"/>
  <g font-family="monospace" font-size="7" letter-spacing="2" fill="#6B7280">
    <text x="16" y="24">EAREENDIL-WORKS · TOOLKIT</text>
    <text x="184" y="24" text-anchor="end" fill="#E8B63E">85.2K★</text>
  </g>

  <!-- 生态辐射：中心 π + 环绕节点 -->
  <g transform="translate(100,140)">
    <!-- 轨道环 -->
    <ellipse cx="0" cy="0" rx="52" ry="20" fill="none" stroke="#E8B63E" stroke-opacity="0.35" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="72" ry="28" fill="none" stroke="#9CA3AF" stroke-opacity="0.22" stroke-width="0.8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 中心 π 徽章 -->
    <rect x="-19" y="-19" width="38" height="38" rx="7" fill="#FAFAF9" filter="url(#neon)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="7" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#09090B">π</text>
    <!-- 生态节点 -->
    <g font-family="monospace" font-size="5">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
        <rect x="46" y="-12" width="52" height="12" rx="4" fill="#161619" stroke="#34D399" stroke-opacity="0.6" stroke-width="0.7"/>
        <text x="72" y="-3" text-anchor="middle" fill="#34D399">OpenClaw 385K★</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
        <rect x="46" y="0" width="48" height="12" rx="4" fill="#161619" stroke="#93C5FD" stroke-opacity="0.6" stroke-width="0.7"/>
        <text x="70" y="9" text-anchor="middle" fill="#93C5FD">Prime Agent</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
        <rect x="-100" y="-14" width="52" height="12" rx="4" fill="#161619" stroke="#F0ABFC" stroke-opacity="0.6" stroke-width="0.7"/>
        <text x="-74" y="-5" text-anchor="middle" fill="#F0ABFC">Cloudflare OS</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
        <rect x="-98" y="0" width="40" height="12" rx="4" fill="#161619" stroke="#9CA3AF" stroke-opacity="0.5" stroke-width="0.7"/>
        <text x="-78" y="9" text-anchor="middle" fill="#D1D5DB">Go·Rust</text>
      </g>
    </g>
  </g>

  <!-- 标题区 (Semantica 式) -->
  <text x="100" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#FAFAF9">Pi</text>
  <text x="100" y="252" text-anchor="middle" font-family="monospace" font-size="7" fill="#E8B63E" letter-spacing="1.5">OPEN SOURCE · MIT · TYPESCRIPT</text>
  <text x="100" y="268" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#6B7280">AI Agent 工具包 · OpenClaw 等构建其上</text>

  <!-- 数据条 -->
  <rect x="24" y="288" width="152" height="24" rx="12" fill="#161619" stroke="#3A3A3D" stroke-width="0.8"/>
  <text x="100" y="304" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#FAFAF9">85.2K★ · OpenClaw 385K★ · Go·Rust</text>

  <!-- 底部 -->
  <text x="100" y="338" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#6B7280" letter-spacing="1">MIND RESONANCE · 反共识观察</text>
</svg>
