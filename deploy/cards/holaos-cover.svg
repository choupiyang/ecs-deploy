<svg xmlns="http://www.w3.org/2000/svg" width="200" height="356" viewBox="0 0 200 356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06121E"/>
      <stop offset="1" stop-color="#0B1D2E"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9DF6EA"/>
      <stop offset="0.45" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0E6B5F"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F4A95E" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#F4A95E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#2DD4BF" stroke-width="0.4" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)"/>
  <circle cx="100" cy="112" r="88" fill="url(#glow)"/>
  <circle cx="100" cy="112" r="60" fill="url(#glow2)"/>

  <!-- 顶部栏 -->
  <rect x="0" y="0" width="200" height="2" fill="#2DD4BF" opacity="0.8"/>
  <text x="14" y="22" font-family="monospace" font-size="7" fill="#7C93A6" letter-spacing="2">HOLAOS · AGENT COMPUTER</text>
  <text x="186" y="22" font-family="monospace" font-size="7" fill="#7DF3E4" text-anchor="end">6.8K★</text>

  <!-- 轨道核：中心=共享内存，轨道=多 Agent -->
  <g transform="translate(100,112)">
    <!-- 内轨 -->
    <ellipse cx="0" cy="0" rx="42" ry="15" fill="none" stroke="#2DD4BF" stroke-width="1" opacity="0.55"/>
    <!-- 中轨 -->
    <ellipse cx="0" cy="0" rx="56" ry="20" fill="none" stroke="#F4A95E" stroke-width="0.8" opacity="0.4"/>
    <!-- 外轨 -->
    <ellipse cx="0" cy="0" rx="66" ry="23" fill="none" stroke="#7DF3E4" stroke-width="0.6" opacity="0.3"/>
    <!-- 轨道卫星（C=Claude Code, X=Codex, h=holaOS） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="9s" repeatCount="indefinite"/>
      <circle cx="42" cy="0" r="8" fill="#2DD4BF">
        <animate attributeName="r" values="8;9;8" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="42" y="2.5" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#04101B">C</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="180 0 0;-180 0 0" dur="14s" repeatCount="indefinite"/>
      <circle cx="56" cy="0" r="7" fill="#F4A95E"/>
      <text x="56" y="2.5" text-anchor="middle" font-family="monospace" font-size="6" font-weight="bold" fill="#1A0E02">X</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="90 0 0;450 0 0" dur="22s" repeatCount="indefinite"/>
      <circle cx="66" cy="0" r="5.5" fill="#9FB8FF"/>
      <text x="66" y="2" text-anchor="middle" font-family="monospace" font-size="5" font-weight="bold" fill="#0A1030">h</text>
    </g>
    <!-- 中心内存核 -->
    <circle cx="0" cy="0" r="17" fill="url(#core)">
      <animate attributeName="r" values="16;18;16" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="23" fill="none" stroke="#7DF3E4" stroke-width="1" stroke-dasharray="4 5" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="3" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#04101B">M</text>
  </g>

  <!-- 标题区 -->
  <text x="100" y="222" text-anchor="middle" font-family="Georgia,serif" font-size="21" font-weight="bold" fill="#E8F1F4">holaOS</text>
  <text x="100" y="242" text-anchor="middle" font-family="monospace" font-size="7" fill="#7DF3E4" letter-spacing="1.5">ONE MEMORY · EVERY AGENT</text>
  <text x="100" y="262" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#7C93A6">给 Agent 一台电脑 · 1.0 发布</text>

  <!-- 数据条 -->
  <rect x="30" y="280" width="140" height="22" rx="11" fill="#0B1D2E" stroke="#2DD4BF" stroke-width="0.7" opacity="0.8"/>
  <text x="100" y="294" text-anchor="middle" font-family="monospace" font-size="7" fill="#E8F1F4">6.8K★ · 605 Forks · Trending #1</text>

  <!-- 底部 -->
  <text x="100" y="338" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#3E5870" letter-spacing="1">MIND RESONANCE · 反共识观察</text>
</svg>
