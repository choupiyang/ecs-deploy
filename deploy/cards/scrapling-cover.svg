<svg xmlns="http://www.w3.org/2000/svg" width="200" height="356" viewBox="0 0 200 356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07130F"/>
      <stop offset="1" stop-color="#0E2118"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="0.5" stop-color="#10B981"/>
      <stop offset="1" stop-color="#0B5E3A"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#16352A" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)" opacity="0.5"/>
  <rect x="0" y="0" width="200" height="2" fill="url(#accentGrad)" opacity="0.8"/>
  <g transform="translate(100,132)">
    <g>
      <circle r="52" fill="none" stroke="#34D399" stroke-width="1" stroke-dasharray="4 5" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle r="39" fill="none" stroke="#0EA5E9" stroke-width="0.8" stroke-dasharray="3 6" opacity="0.45">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="20s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g stroke="#1E4A38" stroke-width="0.7" opacity="0.6">
      <line x1="0" y1="-52" x2="0" y2="52"/>
      <line x1="-52" y1="0" x2="52" y2="0"/>
      <line x1="-37" y1="-37" x2="37" y2="37"/>
      <line x1="37" y1="-37" x2="-37" y2="37"/>
    </g>
    <g filter="url(#glow)">
      <circle r="19" fill="url(#coreGrad)">
        <animate attributeName="r" values="18;20.5;18" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-6" cy="-5" r="2.6" fill="#07130F"/>
      <circle cx="6" cy="-5" r="2.6" fill="#07130F"/>
      <circle cx="-6" cy="-5" r="1.2" fill="#6EE7B7">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="6" cy="-5" r="1.2" fill="#6EE7B7">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      <g stroke="#07130F" stroke-width="1.6" stroke-linecap="round" opacity="0.75">
        <line x1="-10" y1="-8" x2="-20" y2="-18"/>
        <line x1="-10" y1="-2" x2="-22" y2="-6"/>
        <line x1="-10" y1="4" x2="-21" y2="10"/>
        <line x1="10" y1="-8" x2="20" y2="-18"/>
        <line x1="10" y1="-2" x2="22" y2="-6"/>
        <line x1="10" y1="4" x2="21" y2="10"/>
      </g>
      <rect x="-5" y="7" width="10" height="2.4" rx="1.2" fill="#07130F" opacity="0.8"/>
    </g>
    <g>
      <circle r="3.2" fill="#34D399" opacity="0.95">
        <animateMotion dur="5.5s" repeatCount="indefinite" path="M0,-52 A52,52 0 1,1 -0.01,-52 Z"/>
      </circle>
    </g>
    <g>
      <circle r="2.4" fill="#0EA5E9" opacity="0.9">
        <animateMotion dur="8s" repeatCount="indefinite" path="M0,-39 A39,39 0 1,0 -0.01,-39 Z" begin="2.7s"/>
      </circle>
    </g>
  </g>
  <g opacity="0.5">
    <rect x="40" y="246" width="2" height="12" rx="1" fill="#34D399">
      <animate attributeName="y" from="246" to="200" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.8" to="0" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="100" y="254" width="2" height="12" rx="1" fill="#0EA5E9">
      <animate attributeName="y" from="254" to="200" dur="3s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" from="0.8" to="0" dur="3s" repeatCount="indefinite" begin="0.6s"/>
    </rect>
    <rect x="160" y="248" width="2" height="12" rx="1" fill="#6EE7B7">
      <animate attributeName="y" from="248" to="200" dur="2.8s" repeatCount="indefinite" begin="1.2s"/>
      <animate attributeName="opacity" from="0.8" to="0" dur="2.8s" repeatCount="indefinite" begin="1.2s"/>
    </rect>
  </g>
  <rect x="150" y="326" width="36" height="17" rx="3" fill="none" stroke="#34D399" stroke-width="1"/>
</svg>
