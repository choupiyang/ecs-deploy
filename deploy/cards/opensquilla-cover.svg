<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="356" viewBox="0 0 200 356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140B04"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <radialGradient id="octGrad" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#FFB98A"/>
      <stop offset="0.55" stop-color="#ED6000"/>
      <stop offset="1" stop-color="#A83E00"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#2E2014" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)" opacity="0.3"/>

  <!-- 顶部栏 -->
  <rect x="0" y="0" width="200" height="2" fill="#ED6000" opacity="0.9"/>
  <text x="16" y="24" font-family="monospace" font-size="7" fill="#7A6E60" letter-spacing="2">OPEN SQUILLA</text>
  <text x="184" y="24" font-family="monospace" font-size="7" fill="#FF7A26" text-anchor="end">TOKEN-EFFICIENT</text>

  <!-- 中心: 预算漏斗（任务点从四角汇聚中心最优路径） -->
  <g transform="translate(100,130)">
    <!-- 漏斗三角（下行收窄） -->
    <path d="M-14,6 L14,6 L6,42 L-6,42 Z" fill="url(#octGrad)" opacity="0.85" filter="url(#glow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 漏斗出口 -->
    <rect x="-13" y="44" width="26" height="4" rx="2" fill="#FF7A26"/>
    <!-- 汇聚核心 -->
    <circle cx="0" cy="10" r="5" fill="#FFD9B0" opacity="0.9">
      <animate attributeName="r" values="4;6;4" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- 4 个任务点从四角沿直线射向中心（非环形） -->
    <circle r="2.4" fill="#FF9A55">
      <animateMotion dur="3s" repeatCount="indefinite" path="M-60,50 L-4,10 Z" begin="0s"/>
    </circle>
    <circle r="2.4" fill="#FFC27A">
      <animateMotion dur="3.5s" repeatCount="indefinite" path="M62,44 L6,10 Z" begin="0.4s"/>
    </circle>
    <circle r="2.4" fill="#FF9A55">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M-58,-38 L-4,8 Z" begin="0.8s"/>
    </circle>
    <circle r="2.4" fill="#FFC27A">
      <animateMotion dur="3.8s" repeatCount="indefinite" path="M58,-44 L6,8 Z" begin="1.2s"/>
    </circle>
    <!-- 左上角散落的"未优化"暗点 -->
    <circle cx="-40" cy="-30" r="1.6" fill="#5A4A36" opacity="0.5"/>
    <circle cx="-28" cy="-46" r="1" fill="#5A4A36" opacity="0.35"/>
    <!-- 省流标签 -->
    <g>
      <rect x="-36" y="56" width="72" height="13" rx="6.5" fill="#0A0A0A" stroke="#3DBB8F" stroke-width="0.6" opacity="0.9">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="0" y="65.5" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#7CBE52">省 <tspan fill="#ED6000" font-weight="bold">60-80%</tspan> token</text>
    </g>
  </g>

  <!-- 标题区 -->
  <text x="100" y="240" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#F5F0E8">OpenSquilla</text>
  <text x="100" y="276" text-anchor="middle" font-family="monospace" font-size="6" fill="#FF7A26" letter-spacing="1.5">SAME BUDGET · HIGHER INTELLIGENCE</text>
  <text x="100" y="290" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#B8A898">省 60-80% token · 路由四档 · 本地记忆</text>

  <!-- 数据条 -->
  <rect x="24" y="302" width="152" height="24" rx="12" fill="#120B04" stroke="#2E2014" stroke-width="0.8"/>
  <text x="100" y="318" text-anchor="middle" font-family="monospace" font-size="7" fill="#F5F0E8">$0.7 vs $6.2 · 省 9 倍</text>

  <!-- 底部 -->
  <text x="100" y="338" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#7A6E60" letter-spacing="1">MIND RESONANCE · 反共识观察</text>
</svg>
