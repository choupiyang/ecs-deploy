<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="356" viewBox="0 0 200 356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140B04"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="osqGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A26"/>
      <stop offset="1" stop-color="#B44500"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#FF9A55"/>
      <stop offset="0.55" stop-color="#ED6000"/>
      <stop offset="1" stop-color="#A83E00"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#2E2014" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)" opacity="0.3"/>

  <!-- 顶部栏 -->
  <rect x="0" y="0" width="200" height="2" fill="url(#osqGrad)" opacity="0.9"/>
  <text x="16" y="24" font-family="monospace" font-size="7" fill="#7A6E60" letter-spacing="2">OPEN SQUILLA</text>
  <text x="184" y="24" font-family="monospace" font-size="7" fill="#FF7A26" text-anchor="end">TOKEN-EFFICIENT</text>

  <!-- 中心: 智能路由分流（任务 → 四档模型） -->
  <g transform="translate(100,132)">
    <!-- 轨道环 -->
    <circle r="50" fill="none" stroke="#ED6000" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle r="37" fill="none" stroke="#B44500" stroke-width="0.8" stroke-dasharray="3 6" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="19s" repeatCount="indefinite"/>
    </circle>
    <!-- 径向丝 -->
    <g stroke="#2E2014" stroke-width="0.7" opacity="0.8">
      <line x1="0" y1="-50" x2="0" y2="50"/>
      <line x1="-50" y1="0" x2="50" y2="0"/>
      <line x1="-35" y1="-35" x2="35" y2="35"/>
      <line x1="35" y1="-35" x2="-35" y2="35"/>
    </g>

    <!-- 中心核（路由核心） -->
    <g filter="url(#glow)">
      <circle r="25" fill="url(#coreGrad)">
        <animate attributeName="r" values="25;26.5;25" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff" font-weight="bold">🪄</text>
    </g>

    <!-- 四档模型节点（C0-C3，不同色） -->
    <g font-size="7" text-anchor="middle">
      <circle r="8" fill="#0A0A0A" stroke="#3DBB8F" stroke-width="0.9"/>
      <text y="2.5" fill="#3DBB8F" font-weight="bold">C0</text>
      <animateMotion begin="0s" dur="7s" repeatCount="indefinite" path="M0,-40 A40,40 0 1,0 -0.01,-40 Z"/>
    </g>
    <g font-size="7" text-anchor="middle">
      <circle r="8" fill="#0A0A0A" stroke="#7CBE52" stroke-width="0.9"/>
      <text y="2.5" fill="#7CBE52" font-weight="bold">C1</text>
      <animateMotion begin="1.2s" dur="8s" repeatCount="indefinite" path="M0,-29 A29,29 0 0,1 -0.01,-29 Z"/>
    </g>
    <g font-size="7" text-anchor="middle">
      <circle r="8" fill="#0A0A0A" stroke="#5AA8FF" stroke-width="0.9"/>
      <text y="2.5" fill="#5AA8FF" font-weight="bold">C2</text>
      <animateMotion begin="2.4s" dur="9s" repeatCount="indefinite" path="M0,-50 A50,50 0 1,1 -0.01,-50 Z"/>
    </g>
    <g font-size="7" text-anchor="middle">
      <circle r="8" fill="#0A0A0A" stroke="#FFB300" stroke-width="0.9"/>
      <text y="2.5" fill="#FFB300" font-weight="bold">C3</text>
      <animateMotion begin="3.6s" dur="10s" repeatCount="indefinite" path="M0,-22 A22,22 0 0,1 -0.01,-22 Z"/>
    </g>
  </g>

  <!-- 标题区 -->
  <text x="100" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#F5F0E8">OpenSquilla</text>
  <text x="100" y="272" text-anchor="middle" font-family="monospace" font-size="6" fill="#FF7A26" letter-spacing="1.5">SAME BUDGET · HIGHER INTELLIGENCE</text>
  <text x="100" y="286" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#B8A898">省 60-80% token · 路由四档 · 本地记忆</text>

  <!-- 数据条 -->
  <rect x="24" y="300" width="152" height="24" rx="12" fill="#120B04" stroke="#2E2014" stroke-width="0.8"/>
  <text x="100" y="316" text-anchor="middle" font-family="monospace" font-size="7" fill="#F5F0E8">$0.7 vs $6.2 · 省 9 倍</text>

  <!-- 底部 -->
  <text x="100" y="338" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#7A6E60" letter-spacing="1">MIND RESONANCE · 反共识观察</text>
</svg>
