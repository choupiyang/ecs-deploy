<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 356" width="200" height="356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0814"/>
      <stop offset="50%" stop-color="#131022"/>
      <stop offset="100%" stop-color="#1A1430"/>
    </linearGradient>
    <linearGradient id="botGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6E40C9"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#FFE98A"/>
      <stop offset="0.6" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#2A2350" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)" opacity="0.5"/>

  <!-- 顶部栏 -->
  <rect x="0" y="0" width="200" height="2" fill="url(#botGrad)" opacity="0.8"/>
  <text x="16" y="24" font-family="monospace" font-size="7" fill="#6E6490" letter-spacing="2">NOUS · DESKTOP PLUGIN</text>
  <text x="184" y="24" font-family="monospace" font-size="7" fill="#A78BFA" text-anchor="end">379★</text>

  <!-- 中心: 机器人名册环形阵列（几何脸头像环绕 + 消息飞线） -->
  <g transform="translate(100,126)">
    <!-- 外轨道（消息环） -->
    <circle r="58" fill="none" stroke="#8B5CF6" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.45">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="42" fill="none" stroke="#A78BFA" stroke-width="0.7" stroke-dasharray="2 4" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="26s" repeatCount="indefinite"/>
    </circle>

    <!-- 几何脸头像卫星（4 个 bot，各不同形状/颜色） -->
    <!-- bot1: 圆形金脸 -->
    <g>
      <circle cx="0" cy="-58" r="8" fill="url(#coreGrad)" filter="url(#glow)"/>
      <circle cx="-2.5" cy="-60" r="1.3" fill="#1A1430"/>
      <circle cx="2.5" cy="-60" r="1.3" fill="#1A1430"/>
      <path d="M-3 -56.5 q3 2 6 0" stroke="#1A1430" stroke-width="0.8" fill="none" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite"/>
    </g>
    <!-- bot2: 方形紫脸 -->
    <g>
      <rect x="-8" y="-66" width="16" height="16" rx="4" fill="url(#botGrad)" filter="url(#glow)"/>
      <circle cx="-3" cy="-60" r="1.3" fill="#F0EDF8"/>
      <circle cx="3" cy="-60" r="1.3" fill="#F0EDF8"/>
      <path d="M-3 -56 q3 2 6 0" stroke="#E9E2FF" stroke-width="0.8" fill="none" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="26s" repeatCount="indefinite"/>
    </g>
    <!-- bot3: 圆角三角脸（青） -->
    <g>
      <path d="M0 -64 L7 -50 L-7 -50 Z" rx="2" fill="#22D3EE" filter="url(#glow)" opacity="0.9"/>
      <circle cx="-2" cy="-57" r="1.2" fill="#0A0814"/>
      <circle cx="2" cy="-57" r="1.2" fill="#0A0814"/>
      <path d="M-2.5 -53.5 q2.5 1.8 5 0" stroke="#0A0814" stroke-width="0.7" fill="none" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite"/>
    </g>
    <!-- bot4: 粉色圆脸 -->
    <g>
      <circle cx="0" cy="42" r="7" fill="#F472B6" filter="url(#glow)" opacity="0.95"/>
      <circle cx="-2.2" cy="40" r="1.2" fill="#1A1430"/>
      <circle cx="2.2" cy="40" r="1.2" fill="#1A1430"/>
      <path d="M-2.5 43.5 q2.5 1.8 5 0" stroke="#1A1430" stroke-width="0.7" fill="none" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="21s" repeatCount="indefinite"/>
    </g>

    <!-- 消息飞线（bot 之间的 @mention 传递） -->
    <line x1="0" y1="0" x2="0" y2="-58" stroke="#8B5CF6" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="58" y2="0" stroke="#A78BFA" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="0" y2="42" stroke="#8B5CF6" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="-42" y2="0" stroke="#A78BFA" stroke-width="0.5" opacity="0.3"/>
    <!-- 飞线光点（消息传递动画） -->
    <circle r="1.6" fill="#FFE98A" filter="url(#glow)">
      <animateMotion dur="3s" repeatCount="indefinite" path="M0,0 L0,-58"/>
    </circle>
    <circle r="1.6" fill="#22D3EE" filter="url(#glow)">
      <animateMotion dur="4s" repeatCount="indefinite" path="M0,0 L58,0"/>
    </circle>

    <!-- 中心主 bot（当前活跃） -->
    <circle r="16" fill="url(#coreGrad)" filter="url(#glow)">
      <animate attributeName="r" values="14;17;14" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="16" fill="none" stroke="#FFE98A" stroke-width="0.8" opacity="0.6">
      <animate attributeName="r" values="16;25;16" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <!-- 中心脸 -->
    <circle cx="-3.5" cy="-4" r="2.2" fill="#1A1430"/>
    <circle cx="3.5" cy="-4" r="2.2" fill="#1A1430"/>
    <path d="M-4 2 q4 3 8 0" stroke="#1A1430" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <!-- 头顶小天线 -->
    <line x1="0" y1="-16" x2="0" y2="-21" stroke="#FFE98A" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="0" cy="-22" r="1.8" fill="#FFE98A">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 标题区 (Semantica) -->
  <text x="100" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#F0EDF8">Hermes Bot Mode</text>
  <text x="100" y="252" text-anchor="middle" font-family="monospace" font-size="7" fill="#A78BFA" letter-spacing="1.5">AGENT ROSTER · BOT-TO-BOT</text>
  <text x="100" y="268" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#9A92B8">把 Agent 变成一群有名字的机器人</text>

  <!-- 数据条 -->
  <rect x="24" y="288" width="152" height="24" rx="12" fill="#141024" stroke="#2A2350" stroke-width="0.8"/>
  <text x="100" y="304" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#F0EDF8">379★ · 8-13 发布 · MIT</text>

  <!-- 底部 -->
  <text x="100" y="338" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#6E6490" letter-spacing="1">MIND RESONANCE · 反共识观察</text>
</svg>
