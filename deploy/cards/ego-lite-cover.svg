<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 356" width="200" height="356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="50%" stop-color="#10141D"/>
      <stop offset="100%" stop-color="#161B28"/>
    </linearGradient>
    <linearGradient id="egoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C6BFF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="0.55" stop-color="#6D5DF6"/>
      <stop offset="100%" stop-color="#312E81"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#232A3E" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)" opacity="0.5"/>

  <!-- 顶部栏 -->
  <rect x="0" y="0" width="200" height="2" fill="url(#egoGrad)" opacity="0.8"/>
  <text x="16" y="24" font-family="monospace" font-size="7" fill="#5E6884" letter-spacing="2">CITRO LABS · AGENT BROWSER</text>
  <text x="184" y="24" font-family="monospace" font-size="7" fill="#A5B4FC" text-anchor="end">10.5K★</text>

  <!-- 中心: 双 Space 并行浏览器（你的标签页 + Agent 的 Space） -->
  <g transform="translate(100,126)">
    <!-- 外轨道（快照传输环） -->
    <circle r="58" fill="none" stroke="#6D5DF6" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.45">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="42" fill="none" stroke="#A5B4FC" stroke-width="0.7" stroke-dasharray="2 4" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="26s" repeatCount="indefinite"/>
    </circle>

    <!-- 左窗口（你的标签页） -->
    <g>
      <rect x="-34" y="-26" width="30" height="38" rx="3" fill="#0D1220" stroke="#4F46E5" stroke-width="0.9" opacity="0.95"/>
      <rect x="-34" y="-26" width="30" height="8" rx="3" fill="#4F46E5" opacity="0.25"/>
      <circle cx="-29" cy="-22" r="1.3" fill="#FF5F56"/>
      <circle cx="-26" cy="-22" r="1.3" fill="#FFBD2E"/>
      <circle cx="-23" cy="-22" r="1.3" fill="#27C93F"/>
      <rect x="-30" y="-14" width="22" height="2.5" rx="1.25" fill="#3B4A75" opacity="0.7"/>
      <rect x="-30" y="-8" width="18" height="2" rx="1" fill="#3B4A75" opacity="0.5"/>
      <rect x="-30" y="-3" width="20" height="2" rx="1" fill="#3B4A75" opacity="0.5"/>
      <!-- 你 标记 -->
      <text x="-19" y="6" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#A5B4FC" font-weight="bold">你</text>
    </g>
    <!-- 右窗口（Agent 的 Space） -->
    <g>
      <rect x="4" y="-26" width="30" height="38" rx="3" fill="#0D1220" stroke="#A5B4FC" stroke-width="0.9" opacity="0.95">
        <animate attributeName="opacity" values="0.95;0.75;0.95" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="4" y="-26" width="30" height="8" rx="3" fill="#A5B4FC" opacity="0.2"/>
      <circle cx="9" cy="-22" r="1.3" fill="#FF5F56"/>
      <circle cx="12" cy="-22" r="1.3" fill="#FFBD2E"/>
      <circle cx="15" cy="-22" r="1.3" fill="#27C93F"/>
      <rect x="8" y="-14" width="22" height="2.5" rx="1.25" fill="#4A3F9E" opacity="0.8"/>
      <rect x="8" y="-8" width="18" height="2" rx="1" fill="#4A3F9E" opacity="0.6"/>
      <!-- Agent 光标 -->
      <rect x="8" y="-3" width="2" height="7" fill="#7C6BFF" opacity="0.9">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <text x="19" y="6" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#A5B4FC" font-weight="bold">AI</text>
    </g>
    <!-- 中间快照传输箭头 -->
    <g stroke="#A5B4FC" stroke-width="0.8" opacity="0.7">
      <line x1="-2" y1="-8" x2="2" y2="-8"/>
      <path d="M0 -12 l3 4 l-3 4 l-3 -4 z" fill="#A5B4FC" stroke="none" opacity="0.8">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- 轨道卫星：快照/技能/并行 -->
    <circle cx="0" cy="-58" r="4.5" fill="url(#coreGrad)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="58" cy="0" r="4" fill="#A5B4FC" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="26s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-42" cy="0" r="3.6" fill="#6D5DF6" filter="url(#glow)" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- 中心 ego 核 -->
    <circle r="13" fill="url(#coreGrad)" filter="url(#glow)">
      <animate attributeName="r" values="11.5;14;11.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="13" fill="none" stroke="#A5B4FC" stroke-width="0.8" opacity="0.6">
      <animate attributeName="r" values="13;21;13" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <!-- ego 字母 -->
    <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#E8EAFF">ego</text>
  </g>

  <!-- 标题区 (Semantica) -->
  <text x="100" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#E8EAFF">ego lite</text>
  <text x="100" y="252" text-anchor="middle" font-family="monospace" font-size="7" fill="#A5B4FC" letter-spacing="1.5">AGENT BROWSER · PARALLEL SPACES</text>
  <text x="100" y="268" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#8B93A8">你和 Agent 并行工作的浏览器</text>

  <!-- 数据条 -->
  <rect x="24" y="288" width="152" height="24" rx="12" fill="#10141D" stroke="#232A3E" stroke-width="0.8"/>
  <text x="100" y="304" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#E8EAFF">10.5K★ · 快 2.5× · MIT</text>

  <!-- 底部 -->
  <text x="100" y="338" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#5E6884" letter-spacing="1">MIND RESONANCE · 反共识观察</text>
</svg>
