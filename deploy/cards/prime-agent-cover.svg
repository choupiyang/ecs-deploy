<svg xmlns="http://www.w3.org/2000/svg" width="200" height="356" viewBox="0 0 200 356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.55" stop-color="#0A1224"/>
      <stop offset="1" stop-color="#0E1B33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="356" fill="url(#bg)"/>
  <!-- 网格 -->
  <g stroke="#38BDF8" stroke-opacity="0.07" stroke-width="0.5">
    <line x1="0" y1="40" x2="200" y2="40"/><line x1="0" y1="80" x2="200" y2="80"/>
    <line x1="0" y1="120" x2="200" y2="120"/><line x1="0" y1="160" x2="200" y2="160"/>
    <line x1="0" y1="200" x2="200" y2="200"/><line x1="0" y1="240" x2="200" y2="240"/>
    <line x1="0" y1="280" x2="200" y2="280"/><line x1="0" y1="320" x2="200" y2="320"/>
    <line x1="40" y1="0" x2="40" y2="356"/><line x1="80" y1="0" x2="80" y2="356"/>
    <line x1="120" y1="0" x2="120" y2="356"/><line x1="160" y1="0" x2="160" y2="356"/>
  </g>
  <!-- 顶部辉光 -->
  <ellipse cx="100" cy="150" rx="90" ry="120" fill="url(#glow)"/>

  <!-- 3D 递归终端立方体（斜等测投影） -->
  <g transform="translate(100, 148)">
    <!-- 外立方体（青蓝线框） -->
    <g stroke="#38BDF8" stroke-width="1.2" fill="none" opacity="0.95">
      <!-- 前面 -->
      <rect x="-38" y="-30" width="76" height="60" fill="#0A1526" stroke="#38BDF8"/>
      <!-- 顶面 -->
      <polygon points="-38,-30 -18,-45 58,-45 38,-30" fill="#0D1B30" stroke="#38BDF8"/>
      <!-- 右面 -->
      <polygon points="38,-30 58,-45 58,15 38,30" fill="#081120" stroke="#38BDF8"/>
    </g>
    <!-- 前面屏幕细节：菜单栏 -->
    <g stroke="#38BDF8" stroke-width="0.8">
      <line x1="-32" y1="-25" x2="32" y2="-25" opacity="0.7"/>
      <line x1="-32" y1="-25" x2="-22" y2="-25" opacity="0.4"/>
    </g>
    <!-- 前面屏幕：代码行 -->
    <g fill="#7DD3FC" font-family="monospace" font-size="5" opacity="0.9">
      <text x="-32" y="-15">$ prime-agent</text>
      <text x="-32" y="-7" fill="#34D399">✓ kernel alive</text>
      <text x="-32" y="1" fill="#7DD3FC">rlm( "review auth" )</text>
      <text x="-32" y="9" fill="#34D399">✓ child #2 admitted</text>
      <text x="-32" y="17" fill="#7DD3FC">/refine applied</text>
    </g>
    <!-- 光标 -->
    <rect x="-32" y="19" width="10" height="2" fill="#38BDF8" opacity="0.9"/>
    <!-- 内层递归子终端 -->
    <g transform="translate(-6, -4)">
      <rect x="-14" y="-12" width="28" height="22" fill="#0B1830" stroke="#7DD3FC" stroke-width="0.8" rx="2"/>
      <text x="-10" y="-1" fill="#38BDF8" font-family="monospace" font-size="5" opacity="0.85">rlm(</text>
      <text x="-10" y="6" fill="#38BDF8" font-family="monospace" font-size="5" opacity="0.85">...)</text>
    </g>
    <!-- 扫描线 -->
    <g stroke="#38BDF8" stroke-width="0.3" opacity="0.12">
      <line x1="-38" y1="-20" x2="38" y2="-20"/><line x1="-38" y1="-10" x2="38" y2="-10"/>
      <line x1="-38" y1="0" x2="38" y2="0"/><line x1="-38" y1="10" x2="38" y2="10"/>
      <line x1="-38" y1="20" x2="38" y2="20"/>
    </g>
  </g>

  <!-- 标题区 -->
  <g transform="translate(100, 260)">
    <rect x="-88" y="-2" width="176" height="42" rx="6" fill="#0A1526" stroke="#38BDF8" stroke-opacity="0.35"/>
    <text x="0" y="14" text-anchor="middle" fill="#F0F6FC" font-family="'Noto Serif SC', serif" font-size="16" font-weight="900">Prime Agent</text>
    <text x="0" y="30" text-anchor="middle" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="7" letter-spacing="2">SELF-IMPROVING RLM AGENT</text>
  </g>
  <!-- 底部标签 -->
  <g fill="#5B6B85" font-family="'JetBrains Mono', monospace" font-size="5.5" letter-spacing="1.5">
    <text x="10" y="344">8818 ★ · MIT · TYPESCRIPT</text>
    <text x="150" y="344" text-anchor="end" fill="#38BDF8">PA</text>
  </g>
</svg>
