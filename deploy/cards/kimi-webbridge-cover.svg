<svg xmlns="http://www.w3.org/2000/svg" width="200" height="356" viewBox="0 0 200 356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E1A"/>
      <stop offset="1" stop-color="#121A2E"/>
    </linearGradient>
    <linearGradient id="kimiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C1FF"/>
      <stop offset="1" stop-color="#6B46FF"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#7AD9FF"/>
      <stop offset="0.5" stop-color="#00C1FF"/>
      <stop offset="1" stop-color="#3B2BA8"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#1D2A45" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)" opacity="0.5"/>

  <!-- 顶部栏 -->
  <rect x="0" y="0" width="200" height="2" fill="url(#kimiGrad)" opacity="0.8"/>
  <text x="16" y="24" font-family="monospace" font-size="7" fill="#4A5A85" letter-spacing="2">KIMI WEBBRIDGE</text>
  <text x="184" y="24" font-family="monospace" font-size="7" fill="#00C1FF" text-anchor="end">AGENT DRIVES</text>

  <!-- 中心: 浏览器窗口核 + 导航轨道 -->
  <g transform="translate(100,132)">
    <!-- 导航轨道环 -->
    <g>
      <circle r="52" fill="none" stroke="#00C1FF" stroke-width="1" stroke-dasharray="4 5" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle r="39" fill="none" stroke="#6B46FF" stroke-width="0.8" stroke-dasharray="3 6" opacity="0.4">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="20s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- 径向丝 -->
    <g stroke="#23325A" stroke-width="0.7" opacity="0.6">
      <line x1="0" y1="-52" x2="0" y2="52"/>
      <line x1="-52" y1="0" x2="52" y2="0"/>
      <line x1="-37" y1="-37" x2="37" y2="37"/>
      <line x1="37" y1="-37" x2="-37" y2="37"/>
    </g>

    <!-- 中心浏览器窗口核 -->
    <g filter="url(#glow)">
      <rect x="-26" y="-33" width="52" height="66" rx="8" fill="url(#coreGrad)">
        <animate attributeName="y" values="-33;-36;-33" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <!-- 浏览器标签栏 -->
      <rect x="-18" y="-26" width="36" height="8" rx="3" fill="#0A0E1A" opacity="0.85"/>
      <circle cx="-13" cy="-22" r="2" fill="#FF6B6B"/>
      <circle cx="-8" cy="-22" r="2" fill="#FFD93D"/>
      <circle cx="-3" cy="-22" r="2" fill="#6BCB77"/>
      <rect x="6" y="-24" width="12" height="4" rx="1.5" fill="#00C1FF" opacity="0.6"/>
      <!-- 地址栏 -->
      <rect x="-18" y="-14" width="36" height="6" rx="3" fill="#0A0E1A" opacity="0.7"/>
      <circle cx="9" cy="-11" r="1.6" fill="#00C1FF" opacity="0.8"/>
      <!-- 页面内容行 -->
      <rect x="-18" y="-4" width="30" height="3" rx="1.5" fill="#0A0E1A" opacity="0.5"/>
      <rect x="-18" y="1" width="36" height="3" rx="1.5" fill="#0A0E1A" opacity="0.7"/>
      <rect x="-18" y="6" width="24" height="3" rx="1.5" fill="#0A0E1A" opacity="0.45"/>
      <rect x="-18" y="11" width="32" height="3" rx="1.5" fill="#0A0E1A" opacity="0.6"/>
      <rect x="-18" y="16" width="18" height="3" rx="1.5" fill="#0A0E1A" opacity="0.4"/>
      <!-- AI 指示 -->
      <text x="0" y="28" text-anchor="middle" font-family="monospace" font-size="5" fill="#0A0E1A" opacity="0.8" font-weight="bold">KIMI·DRIVE</text>
    </g>

    <!-- 导航游标（AI 驾驶中） -->
    <g>
      <circle r="3.4" fill="#00C1FF" opacity="0.95">
        <animateMotion dur="5.5s" repeatCount="indefinite" path="M0,-52 A52,52 0 1,1 -0.01,-52 Z"/>
      </circle>
    </g>
    <g>
      <circle r="2.4" fill="#7AD9FF" opacity="0.9">
        <animateMotion dur="8s" repeatCount="indefinite" path="M0,-39 A39,39 0 1,0 -0.01,-39 Z" begin="2.7s"/>
      </circle>
    </g>
  </g>

  <!-- 数据流（位于图形区内） -->
  <g opacity="0.5">
    <rect x="40" y="212" width="2" height="12" rx="1" fill="#00C1FF">
      <animate attributeName="y" from="212" to="170" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.8" to="0" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="100" y="218" width="2" height="12" rx="1" fill="#6B46FF">
      <animate attributeName="y" from="218" to="170" dur="3s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" from="0.8" to="0" dur="3s" repeatCount="indefinite" begin="0.6s"/>
    </rect>
    <rect x="160" y="214" width="2" height="12" rx="1" fill="#7AD9FF">
      <animate attributeName="y" from="214" to="170" dur="2.8s" repeatCount="indefinite" begin="1.2s"/>
      <animate attributeName="opacity" from="0.8" to="0" dur="2.8s" repeatCount="indefinite" begin="1.2s"/>
    </rect>
  </g>

  <!-- 标题区 (Semantica 式) -->
  <text x="100" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#E8F4FF">Kimi<tspan x="100" dy="19">WebBridge</tspan></text>
  <text x="100" y="276" text-anchor="middle" font-family="monospace" font-size="6.2" fill="#00C1FF" letter-spacing="1.5">LET KIMI AGENT DRIVE YOUR BROWSER</text>
  <text x="100" y="290" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#7A8CB8">让 AI Agent 驾驶你的浏览器</text>

  <!-- 数据条 -->
  <rect x="24" y="306" width="152" height="24" rx="12" fill="#0E1424" stroke="#23325A" stroke-width="0.8"/>
  <text x="100" y="322" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#E8F4FF">MOONSHOT · AGENT DRIVES · 实时操控</text>

  <!-- 底部 -->
  <text x="100" y="338" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#4A5A85" letter-spacing="1">MIND RESONANCE · 反共识观察</text>
</svg>
