<svg xmlns="http://www.w3.org/2000/svg" width="200" height="356" viewBox="0 0 200 356" role="img" aria-label="SkillHub">
  <title>SkillHub — 企业级 Agent 技能注册中心</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#101B2E"/>
      <stop offset="1" stop-color="#060A12"/>
    </linearGradient>
    <linearGradient id="sh-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="#3B82F6" stroke-opacity="0.06" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)"/>
  <circle cx="100" cy="128" r="80" fill="url(#glow)"/>

  <!-- 顶部栏 -->
  <rect x="0" y="0" width="200" height="2" fill="#3B82F6" opacity="0.8"/>
  <g font-family="monospace" font-size="7" letter-spacing="2" fill="#6B7A99">
    <text x="16" y="24">IFLYTEK · SKILL REGISTRY</text>
    <text x="184" y="24" text-anchor="end" fill="#60A5FA">4.9K★</text>
  </g>

  <!-- isometric 技能包立方体 -->
  <g transform="translate(42,64)">
    <!-- 底部阴影 -->
    <ellipse cx="58" cy="120" rx="48" ry="10" fill="#000" opacity="0.35"/>
    <!-- 顶面 -->
    <polygon points="58,10 108,34 58,58 8,34" fill="#93C5FD" stroke="#BFDBFE" stroke-width="1.2" filter="url(#neon)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <!-- 左面 -->
    <polygon points="8,34 58,58 58,120 8,96" fill="#2563EB" stroke="#60A5FA" stroke-width="1" opacity="0.92"/>
    <!-- 右面 -->
    <polygon points="108,34 58,58 58,120 108,96" fill="#1E40AF" stroke="#60A5FA" stroke-width="1" opacity="0.85"/>
    <!-- 顶面图标 ⚡ -->
    <text x="58" y="40" text-anchor="middle" font-size="16" opacity="0.9">⚡</text>
    <!-- 前面版本 -->
    <text x="58" y="80" text-anchor="middle" font-family="monospace" font-size="7" fill="#BFDBFE" letter-spacing="1">v0.2.16</text>
    <text x="58" y="92" text-anchor="middle" font-family="monospace" font-size="5" fill="#93C5FD" letter-spacing="2">LATEST</text>
  </g>

  <!-- 版本标签 -->
  <g font-family="monospace" font-size="5.5">
    <rect x="152" y="70" width="36" height="13" rx="4" fill="#34D399" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.4" stroke-width="0.7"/>
    <text x="158" y="79" fill="#34D399">beta</text>
    <rect x="12" y="96" width="40" height="13" rx="4" fill="#F0ABFC" fill-opacity="0.08" stroke="#F0ABFC" stroke-opacity="0.4" stroke-width="0.7"/>
    <text x="18" y="105" fill="#F0ABFC">stable</text>
  </g>

  <!-- 标题区 (Semantica 式) -->
  <text x="100" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#F2F4F8">SkillHub</text>
  <text x="100" y="252" text-anchor="middle" font-family="monospace" font-size="7" fill="#60A5FA" letter-spacing="1.5">OPEN SOURCE · APACHE-2.0 · JAVA</text>
  <text x="100" y="268" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#7C8AA5">企业级 Agent 技能注册中心 · v0.2.16</text>

  <!-- 数据条 -->
  <rect x="24" y="288" width="152" height="24" rx="12" fill="#101B2E" stroke="#2A3A5C" stroke-width="0.8"/>
  <text x="100" y="304" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#F2F4F8">4.9K★ · beta/stable · APACHE-2.0</text>

  <!-- 底部 -->
  <text x="100" y="338" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#6B7A99" letter-spacing="1">MIND RESONANCE · 反共识观察</text>
</svg>
