<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 356" width="200" height="356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C0E12"/>
      <stop offset="50%" stop-color="#11141A"/>
      <stop offset="100%" stop-color="#171B23"/>
    </linearGradient>
    <linearGradient id="loopGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9D5C"/>
      <stop offset="100%" stop-color="#E85D3F"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#FFD9A8"/>
      <stop offset="0.55" stop-color="#FF9D5C"/>
      <stop offset="100%" stop-color="#B3402A"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#232A38" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)" opacity="0.5"/>

  <!-- 顶部栏 -->
  <rect x="0" y="0" width="200" height="2" fill="url(#loopGrad)" opacity="0.8"/>
  <text x="16" y="24" font-family="monospace" font-size="7" fill="#5E687E" letter-spacing="2">CLAUDECODE · KARPATHY</text>
  <text x="184" y="24" font-family="monospace" font-size="7" fill="#FF9D5C" text-anchor="end">5.8K★</text>

  <!-- 中心: 永不停止的改进循环（Modify→Verify→Keep→Repeat） -->
  <g transform="translate(100,126)">
    <!-- 外轨道（循环环） -->
    <circle r="58" fill="none" stroke="#FF9D5C" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.45">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="44" fill="none" stroke="#E85D3F" stroke-width="0.7" stroke-dasharray="2 4" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="30" fill="none" stroke="#FFD9A8" stroke-width="0.5" stroke-dasharray="1.5 3" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- 轨道节点：Modify / Verify / Keep / Repeat（循环四步） -->
    <circle cx="0" cy="-58" r="5" fill="url(#coreGrad)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="58" cy="0" r="4.2" fill="#E85D3F" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="44" r="4.5" fill="url(#coreGrad)" filter="url(#glow)" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-44" cy="0" r="3.8" fill="#FFD9A8" filter="url(#glow)" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- 连接线（核心→节点，实验流动） -->
    <line x1="0" y1="0" x2="0" y2="-58" stroke="#FF9D5C" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="58" y2="0" stroke="#E85D3F" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="0" y2="44" stroke="#FF9D5C" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="0" x2="-44" y2="0" stroke="#E85D3F" stroke-width="0.5" opacity="0.3"/>

    <!-- 中心实验核（脉冲 + 递归） -->
    <circle r="16" fill="url(#coreGrad)" filter="url(#glow)">
      <animate attributeName="r" values="14;17;14" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="16" fill="none" stroke="#FFD9A8" stroke-width="0.8" opacity="0.6">
      <animate attributeName="r" values="16;25;16" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <!-- 核内无限符号 ♾ -->
    <path d="M-7 -2 C -5 -7, -1 -7, 0 -2 C 1 3, 5 3, 7 -2 M-7 2 C -5 7, -1 7, 0 2 C 1 -3, 5 -3, 7 2" stroke="#171B23" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.9">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 标题区 (Semantica) -->
  <text x="100" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#F0EDE8">autoresearch</text>
  <text x="100" y="252" text-anchor="middle" font-family="monospace" font-size="7" fill="#FF9D5C" letter-spacing="1.5">MODIFY → VERIFY → KEEP → REPEAT</text>
  <text x="100" y="268" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#9A94A8">永不停止的自主改进引擎</text>

  <!-- 数据条 -->
  <rect x="24" y="288" width="152" height="24" rx="12" fill="#11141A" stroke="#232A38" stroke-width="0.8"/>
  <text x="100" y="304" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#F0EDE8">5.8K★ · token -95% · MIT</text>

  <!-- 底部 -->
  <text x="100" y="338" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#5E687E" letter-spacing="1">MIND RESONANCE · 反共识观察</text>
</svg>
