<svg xmlns="http://www.w3.org/2000/svg" width="200" height="356" viewBox="0 0 200 356">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#131A22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0E7490"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#1E293B" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="356" fill="url(#bg)"/>
  <rect width="200" height="356" fill="url(#grid)" opacity="0.6"/>

  <!-- 顶部栏 -->
  <rect x="0" y="0" width="200" height="2" fill="url(#accentGrad)" opacity="0.8"/>
  <text x="16" y="24" font-family="monospace" font-size="7" fill="#475569" letter-spacing="2">CRAWL4AI</text>
  <text x="184" y="24" font-family="monospace" font-size="7" fill="#22D3EE" text-anchor="end">77.6K★</text>

  <!-- 蜘蛛网/爬虫意象（中心 DOM 节点 + 旋转抓取环，纯 SMIL 无依赖） -->
  <g transform="translate(100,132)">
    <!-- 抓取环（虚线旋转） -->
    <g>
      <circle r="52" fill="none" stroke="#22D3EE" stroke-width="1" stroke-dasharray="4 5" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="16s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle r="38" fill="none" stroke="#3B82F6" stroke-width="0.8" stroke-dasharray="3 6" opacity="0.4">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="22s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- 蜘蛛丝(径向) -->
    <g stroke="#334155" stroke-width="0.7" opacity="0.6">
      <line x1="0" y1="-52" x2="0" y2="52"/>
      <line x1="-52" y1="0" x2="52" y2="0"/>
      <line x1="-37" y1="-37" x2="37" y2="37"/>
      <line x1="37" y1="-37" x2="-37" y2="37"/>
    </g>
    <!-- 中心 DOM 节点(网页结构) -->
    <g filter="url(#glow)">
      <circle r="17" fill="url(#coreGrad)" opacity="0.9">
        <animate attributeName="r" values="16;18.5;16" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <rect x="-6" y="-8" width="12" height="2.4" rx="1" fill="#0B0F14" opacity="0.85"/>
      <rect x="-6" y="-3.6" width="9" height="2.4" rx="1" fill="#0B0F14" opacity="0.6"/>
      <rect x="-6" y="0.8" width="12" height="2.4" rx="1" fill="#0B0F14" opacity="0.85"/>
      <rect x="-6" y="5.2" width="7" height="2.4" rx="1" fill="#0B0F14" opacity="0.5"/>
    </g>
    <!-- 爬虫游标（蜘蛛点，独立组绕中心旋转） -->
    <g>
      <circle r="3.2" fill="#FDE047" opacity="0.95">
        <animateMotion dur="6s" repeatCount="indefinite" path="M0,-52 A52,52 0 1,1 -0.01,-52 Z"/>
      </circle>
    </g>
    <g>
      <circle r="2.4" fill="#22D3EE" opacity="0.9">
        <animateMotion dur="9s" repeatCount="indefinite" path="M0,-38 A38,38 0 1,0 -0.01,-38 Z"/>
      </circle>
    </g>
  </g>

  <!-- 数据流脉冲 (位于图形区内) -->
  <g opacity="0.55">
    <rect x="30" y="212" width="2" height="14" rx="1" fill="#22D3EE">
      <animate attributeName="y" from="212" to="170" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.8" to="0" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="218" width="2" height="14" rx="1" fill="#3B82F6">
      <animate attributeName="y" from="218" to="170" dur="2.9s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" from="0.8" to="0" dur="2.9s" repeatCount="indefinite" begin="0.5s"/>
    </rect>
    <rect x="140" y="214" width="2" height="14" rx="1" fill="#22D3EE">
      <animate attributeName="y" from="214" to="170" dur="2.6s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" from="0.8" to="0" dur="2.6s" repeatCount="indefinite" begin="1s"/>
    </rect>
    <rect x="170" y="212" width="2" height="14" rx="1" fill="#3B82F6">
      <animate attributeName="y" from="212" to="170" dur="3.2s" repeatCount="indefinite" begin="0.2s"/>
      <animate attributeName="opacity" from="0.8" to="0" dur="3.2s" repeatCount="indefinite" begin="0.2s"/>
    </rect>
  </g>

  <!-- 标题区 (Semantica 式) -->
  <text x="100" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#E2E8F0">Crawl4AI</text>
  <text x="100" y="252" text-anchor="middle" font-family="monospace" font-size="7" fill="#22D3EE" letter-spacing="1.5">LLM-FRIENDLY WEB CRAWLER</text>
  <text x="100" y="263" text-anchor="middle" font-family="monospace" font-size="6" fill="#22D3EE" letter-spacing="1">OPEN SOURCE · 77.6K★</text>
  <text x="100" y="278" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#7C8CA3">为 LLM 而生的网页爬虫</text>

  <!-- 数据条 -->
  <rect x="24" y="292" width="152" height="22" rx="11" fill="#0F141B" stroke="#334155" stroke-width="0.8"/>
  <text x="100" y="307" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#E2E8F0">77.6K★ · MIT · Python</text>

  <!-- 底部 -->
  <text x="100" y="338" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#475569" letter-spacing="1">MIND RESONANCE · 反共识观察</text>
</svg>
