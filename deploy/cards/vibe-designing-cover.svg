<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="450" height="800" viewBox="0 0 450 800">
  <!-- 水墨背景 -->
  <rect width="450" height="800" fill="#1a1412"/>
  
  <!-- 水墨晕染效果 -->
  <defs>
    <radialGradient id="ink1" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#e8b4a0" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#e8b4a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ink2" cx="70%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#d4a574" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ink3" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#e8b4a0" stop-opacity="0.08"/>
      <stop offset="40%" stop-color="#e8b4a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ink4" cx="80%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#f5d8ca" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#f5d8ca" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur20">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  
  <rect width="450" height="800" fill="url(#ink1)" filter="url(#blur20)"/>
  <rect width="450" height="800" fill="url(#ink2)" filter="url(#blur20)"/>
  <rect width="450" height="800" fill="url(#ink3)" filter="url(#blur20)"/>
  <rect width="450" height="800" fill="url(#ink4)" filter="url(#blur15)"/>
  
  <!-- 艺术「气」印章 -->
  <g transform="translate(35, 70)">
    <rect x="0" y="0" width="50" height="50" rx="6" fill="rgba(212, 165, 116, 0.06)" stroke="#d4a574" stroke-width="1.5"/>
    <rect x="-4" y="-4" width="58" height="58" rx="8" fill="none" stroke="#d4a574" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="25" y="35" font-family="'Noto Serif SC', Georgia, serif" font-size="28" font-weight="900" fill="#d4a574" text-anchor="middle">气</text>
  </g>
  
  <!-- 标题 -->
  <text x="100" y="110" font-family="'Noto Serif SC', Georgia, serif" font-size="64" font-weight="900" fill="#f5f0eb" letter-spacing="2">气感</text>
  <text x="210" y="110" font-family="'Noto Serif SC', Georgia, serif" font-size="64" font-weight="900" fill="#d4a574">。</text>
  
  <!-- 副标题 -->
  <text x="100" y="138" font-family="'Cormorant Garamond', Georgia, serif" font-size="12" font-style="italic" fill="#8a7a70" letter-spacing="1">Vibe Designing 气感设计手册</text>
  
  <!-- 标签 -->
  <rect x="280" y="126" width="75" height="14" rx="3" fill="none" stroke="#d4a574" stroke-width="0.8"/>
  <text x="317" y="137" font-family="monospace" font-size="7" fill="#d4a574" text-anchor="middle" letter-spacing="1.5">METHODOLOGY</text>
  
  <!-- Tagline -->
  <rect x="35" y="165" width="18" height="1.5" fill="#d4a574"/>
  <text x="60" y="172" font-family="'Noto Serif SC', serif" font-size="11" fill="#f5f0eb" letter-spacing="0.5">AI时代的</text>
  <text x="125" y="172" font-family="'Noto Serif SC', serif" font-size="11" fill="#d4a574" font-weight="500" letter-spacing="0.5">「感觉优先」</text>
  <text x="210" y="172" font-family="'Noto Serif SC', serif" font-size="11" fill="#f5f0eb" letter-spacing="0.5">设计方法论</text>
  
  <!-- 气感三元图 - 核心视觉 -->
  <g transform="translate(35, 210)">
    <rect x="0" y="0" width="380" height="165" rx="12" fill="rgba(45, 35, 32, 0.25)" stroke="#d4a574" stroke-opacity="0.1"/>
    
    <!-- 标题 -->
    <text x="190" y="18" font-family="monospace" font-size="6" fill="#8a7a70" text-anchor="middle" letter-spacing="2">气感三元论 TRINITY</text>
    
    <!-- 三角形 -->
    <path d="M 190 40 L 60 130 L 320 130 Z" stroke="#d4a574" stroke-width="1" stroke-opacity="0.35" fill="none"/>
    <path d="M 190 40 L 60 130 L 320 130 Z" fill="url(#trinityGrad)" opacity="0.12"/>
    
    <!-- 中心气感 -->
    <circle cx="190" cy="95" r="22" fill="rgba(212, 165, 116, 0.08)" stroke="#d4a574" stroke-width="1"/>
    <text x="190" y="100" font-family="'Noto Serif SC', serif" font-size="12" fill="#d4a574" text-anchor="middle" font-weight="500">气感</text>
    
    <!-- 体感 -->
    <circle cx="190" cy="40" r="14" fill="rgba(232, 180, 160, 0.15)" stroke="#e8b4a0" stroke-width="1"/>
    <text x="190" y="44" font-family="'Noto Serif SC', serif" font-size="9" fill="#e8b4a0" text-anchor="middle">体感</text>
    
    <!-- 手感 -->
    <circle cx="60" cy="130" r="14" fill="rgba(212, 165, 116, 0.15)" stroke="#d4a574" stroke-width="1"/>
    <text x="60" y="134" font-family="'Noto Serif SC', serif" font-size="9" fill="#d4a574" text-anchor="middle">手感</text>
    
    <!-- 观感 -->
    <circle cx="320" cy="130" r="14" fill="rgba(245, 216, 202, 0.15)" stroke="#f5d8ca" stroke-width="1"/>
    <text x="320" y="134" font-family="'Noto Serif SC', serif" font-size="9" fill="#f5d8ca" text-anchor="middle">观感</text>
    
    <!-- 流动点 -->
    <circle cx="125" cy="85" r="2.5" fill="#d4a574" opacity="0.6"/>
    <circle cx="255" cy="85" r="2.5" fill="#d4a574" opacity="0.6"/>
    <circle cx="190" cy="130" r="2.5" fill="#d4a574" opacity="0.6"/>
    
    <!-- 三感说明 -->
    <text x="190" y="152" font-family="'Noto Serif SC', serif" font-size="9" fill="#e8b4a0" text-anchor="middle" font-weight="500">体感</text>
    <text x="190" y="162" font-family="monospace" font-size="5" fill="#8a7a70" text-anchor="middle" letter-spacing="1.5">BODY</text>
    
    <text x="30" y="152" font-family="'Noto Serif SC', serif" font-size="9" fill="#d4a574" text-anchor="middle" font-weight="500">手感</text>
    <text x="30" y="162" font-family="monospace" font-size="5" fill="#8a7a70" text-anchor="middle" letter-spacing="1.5">TOUCH</text>
    
    <text x="350" y="152" font-family="'Noto Serif SC', serif" font-size="9" fill="#f5d8ca" text-anchor="middle" font-weight="500">观感</text>
    <text x="350" y="162" font-family="monospace" font-size="5" fill="#8a7a70" text-anchor="middle" letter-spacing="1.5">VISION</text>
  </g>
  
  <defs>
    <linearGradient id="trinityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8b4a0"/>
      <stop offset="50%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#f5d8ca"/>
    </linearGradient>
  </defs>
  
  <!-- 核心功能 -->
  <g transform="translate(35, 400)">
    <!-- 气感三元论 -->
    <rect x="0" y="0" width="380" height="48" rx="8" fill="rgba(45, 35, 32, 0.2)" stroke="#d4a574" stroke-opacity="0.08"/>
    <rect x="12" y="11" width="28" height="28" rx="6" fill="rgba(212, 165, 116, 0.08)"/>
    <circle cx="26" cy="20" r="3" fill="none" stroke="#d4a574" stroke-width="1.5"/>
    <path d="M26 13 L26 15 M26 25 L26 27 M19 20 L21 20 M31 20 L33 20" stroke="#d4a574" stroke-width="1.5"/>
    <text x="52" y="27" font-family="'Noto Sans SC', sans-serif" font-size="10" fill="#f5f0eb">气感三元论</text>
    <text x="52" y="40" font-family="'Noto Sans SC', sans-serif" font-size="8" fill="#8a7a70">体感、手感、观感的统一</text>
    <text x="365" y="28" font-family="monospace" font-size="14" fill="#d4a574" fill-opacity="0.4">→</text>
    
    <!-- 场景驱动 -->
    <rect x="0" y="56" width="380" height="48" rx="8" fill="rgba(45, 35, 32, 0.2)" stroke="#d4a574" stroke-opacity="0.08"/>
    <rect x="12" y="67" width="28" height="28" rx="6" fill="rgba(212, 165, 116, 0.08)"/>
    <path d="M26 73 L18 81 L26 89 L34 81 Z" fill="none" stroke="#d4a574" stroke-width="1.5"/>
    
    
    <text x="365" y="84" font-family="monospace" font-size="14" fill="#d4a574" fill-opacity="0.4">→</text>
    
    <!-- 迭代优化 -->
    <rect x="0" y="112" width="380" height="48" rx="8" fill="rgba(45, 35, 32, 0.2)" stroke="#d4a574" stroke-opacity="0.08"/>
    <rect x="12" y="123" width="28" height="28" rx="6" fill="rgba(212, 165, 116, 0.08)"/>
    <path d="M18 147 L26 139 L34 147" fill="none" stroke="#d4a574" stroke-width="1.5"/>
    <path d="M18 142 L26 134 L34 142" fill="none" stroke="#d4a574" stroke-width="1.5"/>
    
    
    <text x="365" y="140" font-family="monospace" font-size="14" fill="#d4a574" fill-opacity="0.4">→</text>
    
    <!-- AI协作 -->
    <rect x="0" y="168" width="380" height="48" rx="8" fill="rgba(45, 35, 32, 0.2)" stroke="#d4a574" stroke-opacity="0.08"/>
    <rect x="12" y="179" width="28" height="28" rx="6" fill="rgba(212, 165, 116, 0.08)"/>
    <circle cx="26" cy="187" r="4" fill="none" stroke="#d4a574" stroke-width="1.5"/>
    <path d="M26 192 L26 198 M18 203 L26 200 L34 203" fill="none" stroke="#d4a574" stroke-width="1.5"/>
    
    
    <text x="365" y="196" font-family="monospace" font-size="14" fill="#d4a574" fill-opacity="0.4">→</text>
  </g>
  
  <!-- 流程示意 -->
  <rect x="35" y="620" width="380" height="40" rx="8" fill="rgba(232, 180, 160, 0.08)" stroke="#d4a574" stroke-opacity="0.12"/>
  
  
  <!-- 底部色条 -->
  <rect x="0" y="796" width="450" height="4" fill="url(#trinityGrad)"/>
</svg>