<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="450" height="800" viewBox="0 0 450 800">
  <defs>
    <!-- 神经网络节点渐变 -->
    <radialGradient id="nodeGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="1"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    
    <!-- 电光蓝发光 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0815"/>
      <stop offset="50%" stop-color="#1A0F2E"/>
      <stop offset="100%" stop-color="#0D0815"/>
    </linearGradient>
    
    <!-- 神经连接线渐变 -->
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- 深紫背景 -->
  <rect width="450" height="800" fill="url(#bgGrad)"/>
  
  <!-- 神经网络背景纹理 - 动态连接线 -->
  <g opacity="0.15">
    <!-- 水平连接线 -->
    <line x1="20" y1="100" x2="430" y2="100" stroke="#8B5CF6" stroke-width="0.5">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="20" y1="200" x2="430" y2="200" stroke="#06B6D4" stroke-width="0.5">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="20" y1="300" x2="430" y2="300" stroke="#8B5CF6" stroke-width="0.5">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="20" y1="400" x2="430" y2="400" stroke="#06B6D4" stroke-width="0.5">
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="20" y1="500" x2="430" y2="500" stroke="#8B5CF6" stroke-width="0.5">
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="4.5s" repeatCount="indefinite"/>
    </line>
    <line x1="20" y1="600" x2="430" y2="600" stroke="#06B6D4" stroke-width="0.5">
      <animate attributeName="opacity" values="0.2;0.45;0.2" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="20" y1="700" x2="430" y2="700" stroke="#8B5CF6" stroke-width="0.5">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="2.8s" repeatCount="indefinite"/>
    </line>
    
    <!-- 斜向连接线 -->
    <line x1="50" y1="50" x2="150" y2="250" stroke="#8B5CF6" stroke-width="0.3"/>
    <line x1="100" y1="50" x2="250" y2="350" stroke="#06B6D4" stroke-width="0.3"/>
    <line x1="350" y1="50" x2="400" y2="200" stroke="#8B5CF6" stroke-width="0.3"/>
    <line x1="400" y1="100" x2="300" y2="400" stroke="#06B6D4" stroke-width="0.3"/>
  </g>
  
  <!-- 背景神经节点散布 -->
  <g opacity="0.25" filter="url(#glow)">
    <circle cx="30" cy="80" r="2" fill="#8B5CF6">
      <animate attributeName="r" values="1.5;2.5;1.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="120" r="3" fill="#06B6D4">
      <animate attributeName="r" values="2;4;2" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="350" r="2.5" fill="#8B5CF6">
      <animate attributeName="r" values="2;3.5;2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="450" r="2" fill="#06B6D4">
      <animate attributeName="r" values="1.5;3;1.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="550" r="3" fill="#8B5CF6">
      <animate attributeName="r" values="2;4;2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="650" r="2" fill="#06B6D4">
      <animate attributeName="r" values="1.5;2.5;1.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- ===== 主视觉：神经网络对话流 ===== -->
  <g transform="translate(35, 220)">
    <!-- 对话流背景 -->
    <rect x="0" y="0" width="380" height="280" rx="12" fill="rgba(13, 8, 21, 0.6)" stroke="rgba(139, 92, 246, 0.2)" stroke-width="1"/>
    
    <!-- 标签 -->
    <text x="190" y="20" font-family="JetBrains Mono, monospace" font-size="7" fill="#06B6D4" text-anchor="middle" letter-spacing="0.2em">NEURAL DIALOGUE FLOW</text>
    
    <!-- === Layer 1: User Input === -->
    <g transform="translate(25, 45)">
      <!-- 节点外圈 -->
      <circle cx="30" cy="20" r="24" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="30" cy="20" r="18" fill="rgba(6, 182, 212, 0.1)" stroke="#06B6D4" stroke-width="1.5"/>
      <circle cx="30" cy="20" r="8" fill="#06B6D4" filter="url(#glow)"/>
      <!-- 节点脉冲 -->
      <circle cx="30" cy="20" r="12" fill="none" stroke="#06B6D4" stroke-width="2">
        <animate attributeName="r" values="8;18;8" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="55" font-family="JetBrains Mono, monospace" font-size="8" fill="#06B6D4" text-anchor="middle">USER</text>
    </g>
    
    <!-- 脉冲连接线 1: User → Agent -->
    <g>
      <line x1="85" y1="65" x2="135" y2="65" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.4"/>
      <circle cx="110" cy="65" r="3" fill="#8B5CF6">
        <animate attributeName="cx" values="85;135;85" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;1;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- === Layer 2: Agent Core === -->
    <g transform="translate(135, 30)">
      <!-- 多层节点表示 Agent -->
      <circle cx="35" cy="35" r="40" fill="none" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.2">
        <animate attributeName="r" values="38;42;38" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="35" cy="35" r="32" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="35" cy="35" r="24" fill="rgba(139, 92, 246, 0.15)" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="35" cy="35" r="12" fill="#8B5CF6" filter="url(#strongGlow)"/>
      <!-- 内核脉冲 -->
      <circle cx="35" cy="35" r="16" fill="none" stroke="#A78BFA" stroke-width="1.5">
        <animate attributeName="r" values="12;22;12" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="35" y="85" font-family="JetBrains Mono, monospace" font-size="8" fill="#8B5CF6" text-anchor="middle">AGENT</text>
    </g>
    
    <!-- 脉冲连接线 2: Agent → Tools -->
    <g>
      <line x1="215" y1="65" x2="260" y2="65" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.4"/>
      <circle cx="238" cy="65" r="3" fill="#06B6D4">
        <animate attributeName="cx" values="215;260;215" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
    </g>
    
    <!-- === Layer 3: Tools === -->
    <g transform="translate(260, 45)">
      <circle cx="30" cy="20" r="22" fill="none" stroke="#22C55E" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="30" cy="20" r="16" fill="rgba(34, 197, 94, 0.1)" stroke="#22C55E" stroke-width="1.5"/>
      <circle cx="30" cy="20" r="7" fill="#22C55E" filter="url(#glow)"/>
      <circle cx="30" cy="20" r="10" fill="none" stroke="#22C55E" stroke-width="1.5">
        <animate attributeName="r" values="7;14;7" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="50" font-family="JetBrains Mono, monospace" font-size="8" fill="#22C55E" text-anchor="middle">TOOLS</text>
    </g>
    
    <!-- === 下方：协作 Agent 节点群 === -->
    <g transform="translate(50, 130)">
      <!-- Agent 1 -->
      <circle cx="30" cy="25" r="16" fill="rgba(139, 92, 246, 0.08)" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="30" cy="25" r="5" fill="#8B5CF6"/>
      <text x="30" y="50" font-family="JetBrains Mono, monospace" font-size="6" fill="#8B5CF6" text-anchor="middle">A1</text>
      
      <!-- Agent 2 -->
      <circle cx="100" cy="25" r="16" fill="rgba(139, 92, 246, 0.08)" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="100" cy="25" r="5" fill="#8B5CF6"/>
      <text x="100" y="50" font-family="JetBrains Mono, monospace" font-size="6" fill="#8B5CF6" text-anchor="middle">A2</text>
      
      <!-- Agent 3 -->
      <circle cx="170" cy="25" r="16" fill="rgba(6, 182, 212, 0.08)" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="170" cy="25" r="5" fill="#06B6D4"/>
      <text x="170" y="50" font-family="JetBrains Mono, monospace" font-size="6" fill="#06B6D4" text-anchor="middle">A3</text>
      
      <!-- Agent 4 -->
      <circle cx="240" cy="25" r="16" fill="rgba(139, 92, 246, 0.08)" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="240" cy="25" r="5" fill="#8B5CF6"/>
      <text x="240" y="50" font-family="JetBrains Mono, monospace" font-size="6" fill="#8B5CF6" text-anchor="middle">A4</text>
      
      <!-- Agent间连接线 -->
      <line x1="46" y1="25" x2="84" y2="25" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3"/>
      <line x1="116" y1="25" x2="154" y2="25" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3"/>
      <line x1="186" y1="25" x2="224" y2="25" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3"/>
      
      <!-- 脉冲点 -->
      <circle cx="65" cy="25" r="2" fill="#8B5CF6">
        <animate attributeName="cx" values="46;84;46" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="135" cy="25" r="2" fill="#06B6D4">
        <animate attributeName="cx" values="116;154;116" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
      </circle>
      <circle cx="205" cy="25" r="2" fill="#8B5CF6">
        <animate attributeName="cx" values="186;224;186" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
      </circle>
    </g>
    
    <!-- 底部说明 -->
    
  </g>
  
  <!-- ===== 神经网络印章 ===== -->
  <g transform="translate(35, 85)">
    <!-- 外层虚线圆 -->
    <circle cx="28" cy="28" r="32" fill="none" stroke="#8B5CF6" stroke-width="0.8" stroke-dasharray="4,3" stroke-opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0 28 28" to="360 28 28" dur="30s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 中层节点环 -->
    <circle cx="28" cy="28" r="26" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- 内核 -->
    <circle cx="28" cy="28" r="20" fill="rgba(139, 92, 246, 0.08)" stroke="#8B5CF6" stroke-width="1.5"/>
    
    <!-- 中心 L -->
    <text x="28" y="34" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#8B5CF6" text-anchor="middle" filter="url(#glow)">L</text>
    
    <!-- 连接的小节点 -->
    <circle cx="28" cy="4" r="3" fill="#06B6D4" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="52" cy="28" r="3" fill="#8B5CF6" filter="url(#glow)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="28" cy="52" r="3" fill="#06B6D4" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="4" cy="28" r="3" fill="#8B5CF6" filter="url(#glow)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    
    <!-- 连接线 -->
    <line x1="28" y1="8" x2="28" y2="8" stroke="#06B6D4" stroke-width="1"/>
    <line x1="48" y1="28" x2="48" y2="28" stroke="#8B5CF6" stroke-width="1"/>
  </g>
  
  <!-- 标题 -->
  <text x="105" y="118" font-family="Georgia, serif" font-size="52" font-weight="500" fill="#F0F0F0" letter-spacing="1" filter="url(#glow)">LINGBOT</text>
  <text x="332" y="118" font-family="Georgia, serif" font-size="52" font-weight="500" fill="#06B6D4" filter="url(#glow)">.</text>
  
  <!-- 副标题 -->
  <text x="105" y="142" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#6B6B7B" letter-spacing="1">World V2</text>
  
  <!-- 标签 -->
  <rect x="180" y="130" width="80" height="16" rx="3" fill="none" stroke="#22C55E" stroke-width="1"/>
  <text x="220" y="142" font-family="monospace" font-size="8" fill="#22C55E" text-anchor="middle" letter-spacing="1.5">OPEN SOURCE</text>
  
  <!-- 标语 -->
  <line x1="35" y1="175" x2="60" y2="175" stroke="#06B6D4" stroke-width="2"/>
  <text x="68" y="180" font-family="Noto Serif SC, serif" font-size="12" fill="#F0F0F0" letter-spacing="0.5">对话即世界</text>
  <text x="140" y="180" font-family="Noto Serif SC, serif" font-size="12" fill="#06B6D4" letter-spacing="0.5">· 对话驱动的工作流</text>
  
  <!-- 核心功能区域 -->
  <g transform="translate(35, 535)">
    <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="7" fill="#6B6B7B" letter-spacing="0.2em">CORE FEATURES</text>
    
    <!-- Feature 1: 对话驱动 -->
    <rect x="0" y="10" width="185" height="50" rx="8" fill="rgba(139, 92, 246, 0.06)" stroke="rgba(139, 92, 246, 0.2)" stroke-width="1"/>
    <circle cx="25" cy="35" r="12" fill="rgba(6, 182, 212, 0.1)" stroke="#06B6D4" stroke-width="1"/>
    <circle cx="25" cy="35" r="4" fill="#06B6D4"/>
    
    
    
    <!-- Feature 2: 多 Agent 协作 -->
    <rect x="195" y="10" width="185" height="50" rx="8" fill="rgba(6, 182, 212, 0.06)" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1"/>
    <g transform="translate(220, 35)">
      <circle cx="0" cy="0" r="6" fill="none" stroke="#8B5CF6" stroke-width="1"/>
      <circle cx="10" cy="0" r="6" fill="none" stroke="#06B6D4" stroke-width="1"/>
      <circle cx="5" cy="8" r="6" fill="none" stroke="#8B5CF6" stroke-width="1"/>
    </g>
    
    
    
    <!-- Feature 3: 工具集成 -->
    <rect x="0" y="68" width="185" height="50" rx="8" fill="rgba(34, 197, 94, 0.06)" stroke="rgba(34, 197, 94, 0.2)" stroke-width="1"/>
    <rect x="13" y="83" width="24" height="24" rx="4" fill="rgba(34, 197, 94, 0.1)" stroke="#22C55E" stroke-width="1"/>
    <path d="M25 88 L25 102 M18 95 L32 95" stroke="#22C55E" stroke-width="2" fill="none"/>
    
    
    
    <!-- Feature 4: 可视化调试 -->
    <rect x="195" y="68" width="185" height="50" rx="8" fill="rgba(139, 92, 246, 0.06)" stroke="rgba(139, 92, 246, 0.2)" stroke-width="1"/>
    <rect x="208" y="83" width="24" height="24" rx="4" fill="rgba(139, 92, 246, 0.1)" stroke="#8B5CF6" stroke-width="1"/>
    <polyline points="213,95 218,88 224,98 230,85" stroke="#8B5CF6" stroke-width="1.5" fill="none"/>
    
    
  </g>
  
  <!-- Tech Stack -->
  <text x="35" y="680" font-family="JetBrains Mono, monospace" font-size="7" fill="#6B6B7B" letter-spacing="0.2em">TECH STACK</text>
  <g transform="translate(35, 690)">
    <rect x="0" y="0" width="55" height="18" rx="9" fill="none" stroke="#06B6D4" stroke-width="1"/>
    <text x="28" y="13" font-family="monospace" font-size="7" fill="#06B6D4" text-anchor="middle">Python</text>
    
    <rect x="60" y="0" width="62" height="18" rx="9" fill="none" stroke="rgba(139, 92, 246, 0.5)" stroke-width="1"/>
    
    
    <rect x="127" y="0" width="55" height="18" rx="9" fill="none" stroke="rgba(240, 240, 240, 0.2)" stroke-width="1"/>
    
    
    <rect x="187" y="0" width="50" height="18" rx="9" fill="none" stroke="rgba(240, 240, 240, 0.2)" stroke-width="1"/>
    
  </g>
  
  <!-- 底部电光效果 -->
  <rect x="0" y="796" width="450" height="4" fill="url(#lineGrad1)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>