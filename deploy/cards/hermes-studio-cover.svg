<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 356" width="200" height="356">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12091F"/>
      <stop offset="0.55" stop-color="#0B0D18"/>
      <stop offset="1" stop-color="#05060C"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="356" fill="url(#bgGrad)"/>
  <!-- 网格 -->
  <g stroke="#8B5CF6" stroke-opacity="0.07" stroke-width="0.5">
    <path d="M0 60 H200 M0 120 H200 M0 180 H200 M0 240 H200 M0 300 H200"/>
    <path d="M40 0 V356 M80 0 V356 M120 0 V356 M160 0 V356"/>
  </g>

  <!-- 顶部栏 -->
  <rect x="0" y="0" width="200" height="3" fill="#8B5CF6"/>
  <text x="12" y="24" font-family="monospace" font-size="7.5" fill="#9CA3AF" letter-spacing="2">EK·STUDIO</text>
  <text x="188" y="24" font-family="monospace" font-size="7.5" fill="#C4B5FD" text-anchor="end" letter-spacing="1">★ 10.3K</text>

  <!-- 中心图形：控制台核心 + 平台轨道 -->
  <g transform="translate(100,112)">
    <!-- 辉光 -->
    <circle r="58" fill="url(#glow)"/>
    <!-- 外轨（平台轨道） -->
    <g>
      <ellipse rx="52" ry="19" fill="none" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="0.8"/>
      <ellipse rx="52" ry="19" fill="none" stroke="#67E8F9" stroke-opacity="0.15" stroke-width="0.5" transform="rotate(60)"/>
      <ellipse rx="52" ry="19" fill="none" stroke="#67E8F9" stroke-opacity="0.15" stroke-width="0.5" transform="rotate(120)"/>
      <!-- 轨道旋转的平台徽章 -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="14s" repeatCount="indefinite"/>
        <circle r="4.5" fill="#F4F4F5" stroke="#8B5CF6" stroke-width="0.6" cx="0" cy="-52"><animateTransform attributeName="transform" type="rotate" values="0 0 0;-360 0 0" dur="14s" repeatCount="indefinite"/><title>Telegram</title></circle>
        <circle r="4.5" fill="#3B82F6" cx="45.03" cy="26"><animateTransform attributeName="transform" type="rotate" values="0 0 0;-360 0 0" dur="14s" repeatCount="indefinite"/><title>Discord</title></circle>
        <circle r="4.5" fill="#22C55E" cx="-45.03" cy="26"><animateTransform attributeName="transform" type="rotate" values="0 0 0;-360 0 0" dur="14s" repeatCount="indefinite"/><title>Slack</title></circle>
        <circle r="4.5" fill="#F59E0B" cx="-45.03" cy="-26"><animateTransform attributeName="transform" type="rotate" values="0 0 0;-360 0 0" dur="14s" repeatCount="indefinite"/><title>WeChat</title></circle>
        <circle r="4.5" fill="#E11D48" cx="45.03" cy="-26"><animateTransform attributeName="transform" type="rotate" values="0 0 0;-360 0 0" dur="14s" repeatCount="indefinite"/><title>Feishu</title></circle>
      </g>
    </g>

    <!-- 控制台窗口（中心核心） -->
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.06;1" dur="3.4s" repeatCount="indefinite"/>
      <rect x="-24" y="-16" width="48" height="32" rx="4" fill="#0B0D18" stroke="url(#coreGrad)" stroke-width="1.2" filter="url(#neon)"/>
      <!-- 窗口栏 -->
      <rect x="-24" y="-16" width="48" height="7" rx="4" fill="#8B5CF6" fill-opacity="0.35"/>
      <circle cx="-19" cy="-12.5" r="1.4" fill="#FF5F56"/>
      <circle cx="-14.5" cy="-12.5" r="1.4" fill="#FFBD2E"/>
      <circle cx="-10" cy="-12.5" r="1.4" fill="#27C93F"/>
      <!-- 控制台内容：脉冲条 -->
      <rect x="-19" y="-6" width="38" height="3.2" rx="1.6" fill="#8B5CF6" fill-opacity="0.85"/>
      <rect x="-19" y="-1" width="26" height="3.2" rx="1.6" fill="#67E8F9" fill-opacity="0.75"/>
      <rect x="-19" y="4" width="31" height="3.2" rx="1.6" fill="#8B5CF6" fill-opacity="0.5"/>
      <rect x="-19" y="9" width="16" height="3.2" rx="1.6" fill="#67E8F9" fill-opacity="0.45"/>
      <!-- 光标 -->
      <rect x="13" y="9" width="2.4" height="3.2" fill="#C4B5FD">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- 数据脉冲：平台 → 控制台 -->
    <circle r="2" fill="#67E8F9" filter="url(#neon)">
      <animateMotion dur="2.2s" repeatCount="indefinite" path="M0,-52 Q0,-20 0,-18"/>
    </circle>
    <circle r="2" fill="#C4B5FD" filter="url(#neon)">
      <animateMotion dur="2.2s" begin="0.7s" repeatCount="indefinite" path="M-45,26 Q-22,8 0,-6"/>
    </circle>
    <circle r="2" fill="#67E8F9" filter="url(#neon)">
      <animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite" path="M45,-26 Q20,-10 0,-2"/>
    </circle>
  </g>

  <!-- 标题区 -->
  <text x="100" y="228" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#F4F4F5" text-anchor="middle" letter-spacing="0.5">Hermes Studio</text>
  <text x="100" y="252" font-family="monospace" font-size="7.5" fill="#8B5CF6" text-anchor="middle" letter-spacing="1.5">LOCAL CONSOLE FOR HERMES AGENT</text>
  <text x="100" y="270" font-family="system-ui,sans-serif" font-size="8" fill="#9CA3AF" text-anchor="middle">桌面应用 + Web UI · 10 平台接入</text>

  <!-- 数据条 -->
  <rect x="24" y="288" width="152" height="24" rx="12" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="0.7"/>
  <text x="100" y="304" font-family="monospace" font-size="8" fill="#C4B5FD" text-anchor="middle" letter-spacing="0.8">10.3K★ · 10 PLATFORMS · v0.6.42</text>

  <!-- 底部品牌 -->
  <text x="100" y="338" font-family="monospace" font-size="6" fill="#6B7280" text-anchor="middle" letter-spacing="2">MIND RESONANCE · 反共识观察</text>
</svg>
