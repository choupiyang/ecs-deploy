name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/ecs_key
          chmod 600 ~/.ssh/ecs_key
          ssh-keyscan -H ${{ secrets.ECS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Fetch existing card pages for reference
        run: |
          ssh -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} 'cat /var/www/youngsinsight/pages/buzz.html' > ref_pages/buzz.html
          ssh -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} 'cat /var/www/youngsinsight/pages/paxm.html' > ref_pages/paxm.html 2>/dev/null || true
          ssh -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} 'cat /var/www/youngsinsight/pages/treg.html' > ref_pages/treg.html 2>/dev/null || true
          ssh -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} 'cat /var/www/youngsinsight/cards/buzz-cover.svg' > ref_pages/buzz-cover.svg 2>/dev/null || true
          ssh -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} 'cat /var/www/youngsinsight/cards/paxm-cover.svg' > ref_pages/paxm-cover.svg 2>/dev/null || true
          echo "Fetched existing card pages"
          
      - name: Commit reference pages back to repo
        run: |
          git config user.name "ecs-deploy-bot"
          git config user.email "bot@ecs-deploy.local"
          if [ -d "ref_pages" ] && [ "$(ls -A ref_pages 2>/dev/null)" ]; then
            git add ref_pages/
            git commit -m "ref: existing card pages for study" || true
            git push origin main 2>&1
          fi

      - name: Sync files to ECS
        run: |
          ssh -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} "mkdir -p /var/www/youngsinsight/cards /var/www/youngsinsight/pages"
          test -d deploy/cards && ls deploy/cards/*.svg >/dev/null 2>&1 && scp -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no deploy/cards/*.svg ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/var/www/youngsinsight/cards/ || true
          test -d deploy/pages && ls deploy/pages/*.html >/dev/null 2>&1 && scp -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no deploy/pages/*.html ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/var/www/youngsinsight/pages/ || true
          ssh -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} "chmod 644 /var/www/youngsinsight/cards/* /var/www/youngsinsight/pages/* 2>/dev/null || true"

      - name: Update cards.json
        run: |
          if [ -f "update_cards.json" ]; then
            scp -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no update_cards.json ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/var/www/youngsinsight/deploy_patch.json
            ssh -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} 'python3 -c "import json;n=json.load(open(\"/var/www/youngsinsight/deploy_patch.json\"));d=json.load(open(\"/var/www/youngsinsight/cards.json\"));i=next((i for i,c in enumerate(d) if c.get(\"id\")==n[\"id\"]),None);exec(\"d.pop(i);d.insert(0,n)\" if i is not None else \"d.insert(0,n)\");json.dump(d,open(\"/var/www/youngsinsight/cards.json\",\"w\"),ensure_ascii=False,indent=2);print(len(d),\"cards\")"'
          fi

      - name: Verify
        run: |
          ssh -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} "ls -lh /var/www/youngsinsight/cards/ /var/www/youngsinsight/pages/ 2>/dev/null; echo '---'; python3 -c \"import json;d=json.load(open('/var/www/youngsinsight/cards.json'));print(len(d),'cards');[print(' ',c['title'])for c in d[-3:]]\""
