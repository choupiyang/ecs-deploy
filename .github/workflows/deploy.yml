name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/ecs_key
          chmod 600 ~/.ssh/ecs_key
          ssh-keyscan -H ${{ secrets.ECS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

          test -d deploy/pages && ls deploy/pages/*.html >/dev/null 2>&1 && scp -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no deploy/pages/*.html ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/var/www/youngsinsight/pages/ || true
          test -d deploy/cards && scp -r -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no deploy/cards/* ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/var/www/youngsinsight/cards/ || true
          ssh -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} "find /var/www/youngsinsight/cards/ /var/www/youngsinsight/pages/ -type f -exec chmod 644 {} +; find /var/www/youngsinsight/cards/ /var/www/youngsinsight/pages/ -type d -exec chmod 755 {} + 2>/dev/null || true"

      - name: Update cards.json
        run: |
          if [ -f "update_cards.json" ]; then
            scp -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no update_cards.json ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/var/www/youngsinsight/deploy_patch.json
            ssh -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} 'python3 -c "import json;n=json.load(open(\"/var/www/youngsinsight/deploy_patch.json\"));d=json.load(open(\"/var/www/youngsinsight/cards.json\"));i=next((i for i,c in enumerate(d) if c.get(\"id\")==n[\"id\"]),None);exec(\"d.pop(i);d.insert(0,n)\" if i is not None else \"d.insert(0,n)\");d.sort(key=lambda c:c.get(\"date\",\"\"),reverse=True);json.dump(d,open(\"/var/www/youngsinsight/cards.json\",\"w\"),ensure_ascii=False,indent=2);print(len(d),\"cards\")"'
          fi

      - name: Verify
        run: |
          ssh -i ~/.ssh/ecs_key -o StrictHostKeyChecking=no ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} "find /var/www/youngsinsight/cards/ /var/www/youngsinsight/pages/ -type f -exec chmod 644 {} +; find /var/www/youngsinsight/cards/ /var/www/youngsinsight/pages/ -type d -exec chmod 755 {} +; ls -lh /var/www/youngsinsight/cards/ /var/www/youngsinsight/pages/ 2>/dev/null | head -40; echo '---'; python3 -c \"import json;d=json.load(open('/var/www/youngsinsight/cards.json'));print(len(d),'cards');[print(' ',c['title'])for c in d[:3]]\""
